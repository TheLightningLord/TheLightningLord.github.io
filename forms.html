<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Client Intake | Olympian Health Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style id="theme-variables">
    :root {
      --theme-primary: #0284c7; /* Sky 600 - Calming Clinical Blue */
      --theme-primary-light: #e0f2fe; /* Sky 100 */
      --text-main: #334155; /* Slate 700 */
      --text-muted: #64748b; /* Slate 500 */
      --bg-color: #f8fafc; /* Slate 50 - Soft off-white */
      --surface: #ffffff;
      --font-header: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }
  </style>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

    /* === PORTAL HUB ARCHITECTURE === */
    .portal-hub {
        max-width: 1200px;
        margin: 120px auto 40px;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 30px;
        padding: 0 20px;
    }

    @media (max-width: 900px) {
        .portal-hub { grid-template-columns: 1fr; margin-top: 100px; gap: 20px; }
    }

    /* Module Navigation Rail */
    .nav-rail {
        position: sticky;
        top: 100px;
        height: fit-content;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* Mobile Swipe Menu */
    @media (max-width: 900px) {
        .nav-rail { 
            position: relative; top: 0; flex-direction: row; 
            overflow-x: auto; padding-bottom: 10px; scrollbar-width: none;
            margin-bottom: 5px;
        }
        .nav-rail::-webkit-scrollbar { display: none; }
    }

    .doc-module-key {
        background: var(--surface);
        border: 2px solid transparent;
        padding: 20px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: var(--text-muted);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        min-width: 240px;
        flex-shrink: 0;
    }

    .doc-module-key:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .doc-module-key.active {
        background: var(--theme-primary-light);
        color: var(--theme-primary);
        border-color: var(--theme-primary);
        transform: translateX(8px);
    }
    
    @media (max-width: 900px) { 
        .doc-module-key.active { transform: translateY(-3px) translateX(0); } 
        .doc-module-key { padding: 15px; min-width: auto; }
    }

    .step-number {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: var(--bg-color);
        color: var(--text-muted);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 0.9rem;
        flex-shrink: 0;
        transition: 0.3s;
    }

    .active .step-number { 
        background: var(--theme-primary); 
        color: white;
    }

    .nav-label { display: flex; flex-direction: column; line-height: 1.3; }
    .nav-label strong { font-family: var(--font-header); font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .active .nav-label strong { color: var(--theme-primary); }
    .nav-label span { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Module Viewport */
    .viewport-module {
        background: var(--surface);
        border-radius: 24px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        min-height: 75vh;
        display: flex; flex-direction: column;
    }

    .form-container { 
        flex-grow: 1;
        width: 100%; 
        border: none; 
        background: #fff; 
    }

    /* Clinical Note Bar (Formerly AI Insight) */
    .clinical-note-anchor {
        background: #ffffff;
        padding: 24px 32px;
        border-bottom: 2px solid var(--bg-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }
    
    .note-left { display: flex; align-items: center; gap: 16px; }
    
    .note-icon {
        width: 48px; height: 48px;
        background: var(--theme-primary-light);
        color: var(--theme-primary);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    
    .note-text { font-size: 1rem; font-weight: 500; line-height: 1.5; color: var(--text-main); }
    .note-text strong { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--theme-primary); margin-bottom: 4px; }

    /* Utility Buttons */
    .util-btns { display: flex; gap: 10px; }
    .util-btn {
        padding: 10px 20px; border-radius: 8px;
        font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
        border: 2px solid var(--theme-primary-light); color: var(--theme-primary); background: transparent;
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .util-btn:hover { background: var(--theme-primary-light); }

    @media (max-width: 640px) {
        .clinical-note-anchor { padding: 20px; flex-direction: column; align-items: flex-start; gap: 15px; }
        .util-btns { width: 100%; }
        .util-btn { flex: 1; justify-content: center; }
        .note-text { font-size: 0.95rem; }
    }

    /* Global Nav Navigation */
    nav.fixed-nav {
      position: fixed; top: 0; left: 0;
      width: 100%; z-index: 1000;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
    }
    
    .brand { font-family: var(--font-header); font-weight: 900; font-size: 1.4rem; color: var(--text-main); text-decoration: none; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--theme-primary); }

    .secure-footer { margin-top: 40px; text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); padding-bottom: 40px; display: flex; align-items: center; justify-content: center; gap: 8px;}

  </style>
</head>
<body>

  <canvas id="bubble-canvas"></canvas>

  <nav class="fixed-nav">
    <a href="index.html" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-sky-600"><path d="M12 2v20M2 12h20"/></svg>
        Olympian <span>Health</span>
    </a>
    <div class="flex gap-6 items-center">
        <a href="index.html" class="text-xs font-bold uppercase tracking-wide text-slate-500 no-underline hover:text-sky-600 transition-colors">Home</a>
        <a href="booking.html" class="text-xs font-bold uppercase tracking-wide text-white bg-sky-600 px-4 py-2 rounded-lg hover:bg-sky-700 transition-colors shadow-sm">Schedule Session</a>
    </div>
  </nav>

  <div class="portal-hub">
      
      <div class="nav-rail">
          <div class="doc-module-key active" onclick="loadModule('intake')" id="key-intake">
              <div class="step-number">1</div>
              <div class="nav-label">
                  <span>Required</span>
                  <strong>Health Intake</strong>
              </div>
          </div>
          <div class="doc-module-key" onclick="loadModule('nutrition')" id="key-nutrition">
              <div class="step-number">2</div>
              <div class="nav-label">
                  <span>Optional</span>
                  <strong>Nutrition Audit</strong>
              </div>
          </div>
          <div class="doc-module-key" onclick="loadModule('waiver')" id="key-waiver">
              <div class="step-number">3</div>
              <div class="nav-label">
                  <span>Required</span>
                  <strong>Safety Waiver</strong>
              </div>
          </div>
      </div>

      <div class="viewport-module" id="viewport">
          
          <div class="clinical-note-anchor">
              <div class="note-left">
                  <div class="note-icon">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                  </div>
                  <div class="note-text">
                      <strong>Clinical Guide</strong>
                      <span id="ai-insight-text">Loading form details...</span>
                  </div>
              </div>
              <div class="util-btns">
                  <button class="util-btn" onclick="copyLink()">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                      Copy Link
                  </button>
              </div>
          </div>

          <iframe id="doc-iframe" class="form-container" src="https://docs.google.com/forms/d/e/1FAIpQLSdktzd8imbMzhFPlwbio76bLBl4nY2mhqJDwoISpD16jmqucA/viewform?embedded=true">
              Loading...
          </iframe>
      </div>

  </div>

  <div class="secure-footer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Secure, private, and HIPAA Compliant Data Handling
  </div>

  <script>
    const apiKey = ""; // Add your Gemini API Key here if desired

    // FORM DATABASE
    const moduleBank = {
        intake: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSdktzd8imbMzhFPlwbio76bLBl4nY2mhqJDwoISpD16jmqucA/viewform?embedded=true",
            objective: "establishing your baseline mobility and ensuring your exercises are perfectly safe for your current physical condition."
        },
        nutrition: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSfirjow4l1d38-MvewY07lLW-eS6aTmZIMGTpB_Yle4OiHGEQ/viewform?embedded=true", 
            objective: "understanding your daily habits so we can fuel your recovery and keep your energy levels high."
        },
        waiver: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSfirjow4l1d38-MvewY07lLW-eS6aTmZIMGTpB_Yle4OiHGEQ/viewform?embedded=true", 
            objective: "confirming our mutual commitment to safe, professional, and effective practice."
        }
    };

    function loadModule(key) {
        const iframe = document.getElementById('doc-iframe');
        
        // Reset Active States
        document.querySelectorAll('.doc-module-key').forEach(k => k.classList.remove('active'));
        const activeKey = document.getElementById(`key-${key}`);
        if(activeKey) activeKey.classList.add('active');

        // Iframe Transition
        iframe.style.opacity = '0.3';
        setTimeout(() => {
            iframe.src = moduleBank[key].url;
            iframe.style.opacity = '1';
        }, 300);

        syncAIPartner(key);
    }

    async function syncAIPartner(key) {
        const textEl = document.getElementById('ai-insight-text');
        textEl.style.opacity = "0.4";
        
        const info = moduleBank[key].objective;
        const fallbackText = `Welcome! This form is vital for ${info} Take your time!`;
        
        // If no API key is set, use the friendly fallback text.
        if (!apiKey) {
            setTimeout(() => {
                textEl.textContent = fallbackText;
                textEl.style.opacity = "1";
            }, 300);
            return;
        }

        const prompt = `Context: This form is for ${info}. Write a single, warm, welcoming sentence explaining why this form helps build a safer, better rehabilitation/training plan. Keep it highly readable and encouraging. Max 20 words.`;
        const system = "You are a warm, professional Physical Therapist Assistant communicating with a client.";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: system }] }
                })
            });
            const result = await response.json();
            textEl.textContent = result.candidates[0].content.parts[0].text;
        } catch (e) {
            textEl.textContent = fallbackText;
        }
        textEl.style.opacity = "1";
    }

    // Copy Link
    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("Link copied to clipboard!");
        });
    }

    // --- SOFT BACKGROUND ENGINE ---
    const canvas = document.getElementById('bubble-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, bubbles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initBubbles();
    }

    class Bubble {
      constructor() { this.reset(); }
      reset() {
        this.r = Math.random() * 40 + 20; // Larger, softer circles
        this.x = Math.random() * width;
        this.y = height + this.r + Math.random() * 500;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = -(Math.random() * 0.5 + 0.2); // Slower floating
        this.opacity = Math.random() * 0.03 + 0.01; // Very faint
      }
      update() {
        this.y += this.vy; this.x += this.vx;
        if (this.y < -this.r) this.reset();
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(2, 132, 199, ${this.opacity})`; /* Sky blue fill */
        ctx.fill();
      }
    }

    function initBubbles() { bubbles = Array.from({length: 25}, () => new Bubble()); }
    function animate() {
      ctx.clearRect(0, 0, width, height);
      bubbles.forEach(b => { b.update(); b.draw(); });
      requestAnimationFrame(animate);
    }

    window.onresize = resize;

    window.onload = () => {
        resize(); animate();
        loadModule('intake'); // Default load
    };
  </script>
</body>
</html>
