<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synchronize | Olympian Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            header: ['Outfit', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            olympian: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
              dark: '#0f172a',
              darkGlass: 'rgba(15, 23, 42, 0.85)'
            }
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            'glow': '0 0 20px rgba(14, 165, 233, 0.3)',
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-sm': 'bounce 2s infinite',
          }
        }
      }
    }
  </script>

  <style>
    /* === BASE VARIABLES === */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.9);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --bg-gradient-start: #f0f9ff;
      --bg-gradient-end: #e0f7fa;
      --blur-strength: 30px;
    }

    /* DARK MODE VARIABLES */
    .dark-mode {
      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(30, 41, 59, 0.8);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.5s ease, color 0.5s ease;
    }

    /* === NEURAL BACKGROUND === */
    canvas#vitality-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }

    /* === GLASS UI === */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-strength));
      -webkit-backdrop-filter: blur(var(--blur-strength));
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* === INTERACTIVE TABS === */
    .nav-pill {
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .nav-pill::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 50%; width: 0%; height: 3px;
      background: #0ea5e9; border-radius: 99px;
      transform: translateX(-50%); transition: width 0.3s ease;
    }

    .nav-pill.active { color: #0ea5e9; background: rgba(14, 165, 233, 0.1); }
    .nav-pill.active::after { width: 40%; }
    
    /* Checked State for Tabs */
    .nav-pill.completed .check-icon { display: block; }
    .check-icon { display: none; }

    /* === IFRAME HANDLING === */
    iframe {
      width: 100%; height: 100%; border: none;
      opacity: 0; transition: opacity 0.5s ease;
    }
    iframe.loaded { opacity: 1; }

    /* === FOCUS MODE === */
    .focus-active {
      position: fixed !important;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw !important; height: 100vh !important;
      z-index: 9999;
      border-radius: 0 !important;
      margin: 0 !important;
    }
    
    .focus-active .form-header { padding: 20px 40px; }
    body.in-focus-mode nav, body.in-focus-mode .left-column { opacity: 0; pointer-events: none; }

    /* === LOADERS === */
    .loader-ring { display: inline-block; width: 24px; height: 24px; }
    .loader-ring:after {
      content: " "; display: block; width: 20px; height: 20px; margin: 2px;
      border-radius: 50%; border: 2px solid #0ea5e9;
      border-color: #0ea5e9 transparent #0ea5e9 transparent;
      animation: ring-spin 1.2s linear infinite;
    }
    @keyframes ring-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* === CONFETTI CANVAS === */
    #confetti-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999; pointer-events: none;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <!-- BACKGROUND: Neural Network -->
  <canvas id="vitality-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>

  <!-- NAVIGATION -->
  <nav class="fixed top-0 left-0 w-full z-50 px-6 py-4 flex justify-between items-center transition-all duration-300" id="main-nav">
    <a href="index.html" class="flex items-center gap-2 group text-decoration-none">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <div class="flex flex-col leading-none">
          <span class="font-header font-bold text-lg text-slate-800 dark:text-slate-200 tracking-tight">Olympian<span class="text-blue-500">Health</span></span>
          <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Clinical Portal</span>
      </div>
    </a>

    <!-- Session Timer (Clinical Touch) -->
    <div class="hidden md:flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 backdrop-blur-md px-4 py-2 rounded-full border border-blue-100 dark:border-slate-700">
        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Session Active: <span id="session-timer" class="text-slate-800 dark:text-slate-200 tabular-nums">00:00</span></span>
    </div>

    <div class="hidden md:flex gap-1 bg-white/60 dark:bg-slate-800/60 backdrop-blur-md p-1.5 rounded-full border border-white/50 dark:border-slate-700 shadow-sm">
      <a href="index.html" class="px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:bg-white dark:hover:bg-slate-700 transition-all">Home</a>
      <a href="forms.html" class="px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest text-white bg-blue-500 shadow-md">Portal</a>
    </div>
  </nav>

  <!-- MAIN LAYOUT -->
  <main class="relative pt-24 pb-6 px-4 max-w-[1600px] mx-auto min-h-screen flex flex-col lg:flex-row gap-6">
    
    <!-- LEFT COLUMN: CONTEXT (Collapses in Focus Mode) -->
    <section class="lg:w-1/4 flex flex-col gap-5 left-column transition-opacity duration-500">
        
        <!-- Smart Welcome Card -->
        <div class="glass-panel p-8 rounded-3xl bg-white/70 dark:bg-slate-900/70 border-white dark:border-slate-800 shadow-xl relative overflow-hidden group">
            <h1 class="font-header text-3xl font-extrabold text-slate-800 dark:text-slate-100 mb-2 leading-tight">
                <span id="greeting-text">Good Morning.</span><br/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">Ready to Sync?</span>
            </h1>
            <p class="font-body text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-6">
                Your data builds the foundation of your recovery protocol. Accuracy ensures velocity.
            </p>
            
            <div class="flex items-center gap-3 text-xs font-bold uppercase tracking-wider text-slate-400 border-t border-slate-100 dark:border-slate-800 pt-4">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-500"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Est. Time: <span id="time-estimate" class="text-slate-700 dark:text-slate-300">5 Mins</span>
            </div>
        </div>

        <!-- AI Assistant Bubble -->
        <div class="glass-panel p-6 rounded-3xl bg-gradient-to-br from-slate-900 to-slate-800 text-white shadow-glow relative animate-float border-0">
            <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center flex-shrink-0 border border-blue-400/30">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div>
                    <h3 class="font-header font-bold text-sm text-blue-300 uppercase tracking-widest mb-2 flex items-center gap-2">
                        Coach Insight
                        <div id="ai-loading" class="loader-ring w-3 h-3 border-white hidden"></div>
                    </h3>
                    <p id="ai-insight-text" class="text-slate-300 font-medium text-sm leading-relaxed">
                        Loading protocol context...
                    </p>
                </div>
            </div>
        </div>

    </section>

    <!-- RIGHT COLUMN: EXPANSIVE FORM AREA -->
    <section class="lg:w-3/4 flex flex-col transition-all duration-500 h-[85vh] lg:h-[88vh]" id="form-container-wrapper">
        
        <div class="glass-panel w-full h-full rounded-[24px] shadow-2xl bg-white dark:bg-slate-900 flex flex-col overflow-hidden ring-1 ring-slate-900/5 transition-all duration-500" id="form-card">
            
            <!-- Form Header & Tabs -->
            <div class="form-header flex items-center justify-between px-4 py-3 bg-slate-50/90 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700 backdrop-blur-md z-10">
                
                <!-- Tab Group -->
                <div class="flex gap-2 overflow-x-auto no-scrollbar max-w-full items-center">
                    <button onclick="switchModule('intake')" id="tab-intake" class="nav-pill active whitespace-nowrap px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-700 flex items-center gap-2">
                        <span class="check-icon text-green-500">✓</span>
                        <span class="w-2 h-2 rounded-full bg-blue-500 status-dot"></span>
                        Intake
                    </button>
                    <button onclick="switchModule('nutrition')" id="tab-nutrition" class="nav-pill whitespace-nowrap px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-700 flex items-center gap-2">
                        <span class="check-icon text-green-500">✓</span>
                        <span class="w-2 h-2 rounded-full bg-green-500 status-dot"></span>
                        Nutrition
                    </button>
                    <button onclick="switchModule('waiver')" id="tab-waiver" class="nav-pill whitespace-nowrap px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-700 flex items-center gap-2">
                        <span class="check-icon text-green-500">✓</span>
                        <span class="w-2 h-2 rounded-full bg-purple-500 status-dot"></span>
                        Waiver
                    </button>
                    <!-- NEW FEEDBACK BUTTON -->
                    <button onclick="switchModule('feedback')" id="tab-feedback" class="nav-pill whitespace-nowrap px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-700 flex items-center gap-2 border border-dashed border-slate-300 dark:border-slate-600">
                        <span class="check-icon text-green-500">✓</span>
                        <span class="w-2 h-2 rounded-full bg-orange-500 status-dot"></span>
                        Feedback
                    </button>
                </div>

                <!-- Utilities -->
                <div class="flex items-center gap-2 pl-4 border-l border-slate-200 dark:border-slate-700">
                    <!-- DARK MODE TOGGLE -->
                    <button onclick="toggleTheme()" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-700 rounded-lg transition-colors" title="Toggle Recovery Mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                    
                    <button onclick="toggleFocusMode()" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-700 rounded-lg transition-colors" title="Toggle Focus Mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                    </button>
                    <button onclick="reloadFrame()" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-700 rounded-lg transition-colors" title="Reload Form">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    </button>
                </div>
            </div>

            <!-- Iframe Container -->
            <div class="iframe-wrapper relative bg-white dark:bg-slate-900 flex-grow w-full">
                <!-- Loader -->
                <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center bg-white dark:bg-slate-900 z-20 transition-opacity duration-300 pointer-events-none">
                    <div class="flex flex-col items-center gap-4">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-full border-4 border-blue-100 dark:border-slate-700"></div>
                            <div class="absolute top-0 left-0 w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin"></div>
                        </div>
                        <span class="text-[10px] font-black tracking-[0.2em] text-slate-400 uppercase">Synchronizing...</span>
                    </div>
                </div>
                
                <iframe id="main-frame" src=""></iframe>
            </div>

            <!-- QUICK ACTIONS FOOTER (New Upgrade) -->
            <div class="py-2 px-4 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs">
                <div class="flex gap-3">
                    <span class="font-bold text-slate-400 uppercase tracking-widest text-[9px]">Quick Copy:</span>
                    <button onclick="copyText('Coach-Dave-ID-8842')" class="text-blue-600 dark:text-blue-400 font-mono hover:underline">CoachID: #8842</button>
                    <button onclick="copyText(new Date().toLocaleDateString())" class="text-blue-600 dark:text-blue-400 font-mono hover:underline">Today's Date</button>
                </div>
                <button onclick="markComplete()" class="flex items-center gap-2 px-3 py-1 bg-green-500 text-white rounded-md font-bold uppercase tracking-wider hover:bg-green-600 transition-colors shadow-sm">
                    <span>Mark Complete</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
            </div>

        </div>
    </section>

  </main>

  <script>
    const apiKey = ""; // Environment

    // --- CONFIGURATION ---
    const modules = {
        intake: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSfirjow4l1d38-MvewY07lLW-eS6aTmZIMGTpB_Yle4OiHGEQ/viewform?embedded=true", 
            context: "detailed nutrition and metabolic intake",
            estimate: "8 Mins"
        },
        nutrition: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSdktzd8imbMzhFPlwbio76bLBl4nY2mhqJDwoISpD16jmqucA/viewform?embedded=true",
            context: "primary health history assessment",
            estimate: "5 Mins"
        },
        waiver: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSfirjow4l1d38-MvewY07lLW-eS6aTmZIMGTpB_Yle4OiHGEQ/viewform?embedded=true", 
            context: "safety protocol and informed consent",
            estimate: "2 Mins"
        },
        // NEW FEEDBACK MODULE
        feedback: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSc6us_gEF748nOKJsMHDFCJtbQCEp70coiIbzrfQDaQ2HCdkw/viewform?embedded=true",
            context: "post-session performance analysis",
            estimate: "3 Mins"
        }
    };

    let currentModule = 'intake';

    // --- SESSION TIMER ---
    let seconds = 0;
    function startTimer() {
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('session-timer').textContent = `${mins}:${secs}`;
        }, 1000);
    }

    // --- SMART GREETING ---
    function setGreeting() {
        const hour = new Date().getHours();
        const text = document.getElementById('greeting-text');
        if (hour < 12) text.textContent = "Good Morning.";
        else if (hour < 18) text.textContent = "Good Afternoon.";
        else text.textContent = "Good Evening.";
    }

    // --- MODULE SWITCHING ---
    function switchModule(key) {
        currentModule = key;
        const frame = document.getElementById('main-frame');
        const loader = document.getElementById('loading-indicator');
        const estimateEl = document.getElementById('time-estimate');

        // Update Tabs
        document.querySelectorAll('.nav-pill').forEach(btn => {
            btn.classList.remove('active', 'bg-blue-50', 'dark:bg-slate-700', 'text-blue-600');
            btn.classList.add('text-slate-500', 'dark:text-slate-400');
        });
        const activeTab = document.getElementById(`tab-${key}`);
        activeTab.classList.add('active', 'text-blue-600');
        activeTab.classList.remove('text-slate-500', 'dark:text-slate-400');

        // Update Info
        estimateEl.textContent = modules[key].estimate;

        // Reset Frame
        loader.style.opacity = '1';
        frame.classList.remove('loaded');
        
        setTimeout(() => {
            frame.src = modules[key].url;
        }, 300);

        updateAIContext(key);
    }

    function toggleFocusMode() {
        document.getElementById('form-card').classList.toggle('focus-active');
        document.body.classList.toggle('in-focus-mode');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.documentElement.classList.toggle('dark');
        // Redraw canvas with new colors
        initParticles();
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        // Simple visual feedback could go here
    }

    function reloadFrame() {
        const frame = document.getElementById('main-frame');
        frame.src = frame.src;
        document.getElementById('loading-indicator').style.opacity = '1';
        frame.classList.remove('loaded');
    }

    function handleIframeLoad() {
        const frame = document.getElementById('main-frame');
        const loader = document.getElementById('loading-indicator');
        if (!frame.src || frame.src === 'about:blank' || frame.src === window.location.href) return;
        loader.style.opacity = '0';
        frame.classList.add('loaded');
    }

    // --- UPGRADE: COMPLETION TRACKER ---
    function markComplete() {
        const btn = document.getElementById(`tab-${currentModule}`);
        if(btn) btn.classList.add('completed');
        fireConfetti();
        // Save to local storage in real app
    }

    function fireConfetti() {
        const c = document.getElementById('confetti-canvas');
        const cx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        
        let confetti = [];
        const colors = ['#0ea5e9', '#22c55e', '#a855f7', '#f97316'];
        
        for(let i=0; i<100; i++) {
            confetti.push({
                x: window.innerWidth/2,
                y: window.innerHeight/2,
                vx: (Math.random()-0.5)*20,
                vy: (Math.random()-0.5)*20,
                color: colors[Math.floor(Math.random()*colors.length)],
                size: Math.random()*8+4,
                life: 100
            });
        }

        function draw() {
            cx.clearRect(0,0,c.width,c.height);
            let active = false;
            confetti.forEach(p => {
                if(p.life > 0) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // Gravity
                    p.life--;
                    cx.fillStyle = p.color;
                    cx.fillRect(p.x, p.y, p.size, p.size);
                }
            });
            if(active) requestAnimationFrame(draw);
            else cx.clearRect(0,0,c.width,c.height);
        }
        draw();
    }

    // --- AI CONTEXT ENGINE ---
    async function updateAIContext(key) {
        const textEl = document.getElementById('ai-insight-text');
        const loadingSpinner = document.getElementById('ai-loading');
        
        textEl.style.opacity = '0.5';
        loadingSpinner.classList.remove('hidden');

        const context = modules[key].context;
        const prompt = `Act as an elite sports physiologist. Give me one short, motivating sentence (max 15 words) about why completing the "${context}" helps the athlete perform better. No hashtags.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            const insight = data.candidates[0].content.parts[0].text;
            animateTextChange(textEl, insight);
        } catch (e) {
            animateTextChange(textEl, `This ${context} is vital for calibrating your performance baseline.`);
        } finally {
            loadingSpinner.classList.add('hidden');
            textEl.style.opacity = '1';
        }
    }

    function animateTextChange(element, newText) {
        element.style.transform = "translateY(5px)";
        element.style.opacity = "0";
        setTimeout(() => {
            element.innerText = newText;
            element.style.transform = "translateY(0)";
            element.style.opacity = "1";
        }, 300);
    }

    // --- NEURAL NETWORK BACKGROUND ---
    const canvas = document.getElementById('vitality-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    let mouse = { x: null, y: null, radius: 150 };

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 2 + 1;
            this.baseColor = document.body.classList.contains('dark-mode') ? 
                             `rgba(56, 189, 248, ${Math.random() * 0.3 + 0.1})` : 
                             `rgba(14, 165, 233, ${Math.random() * 0.3 + 0.1})`;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            if(mouse.x != null) {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    const directionX = forceDirectionX * force * 3;
                    const directionY = forceDirectionY * force * 3;
                    this.x -= directionX;
                    this.y -= directionY;
                }
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.baseColor;
            ctx.fill();
        }
    }

    function connect() {
        let opacityValue = 1;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a; b < particles.length; b++) {
                let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x))
                             + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                if (distance < (width/7) * (height/7)) {
                    opacityValue = 1 - (distance / 20000);
                    let color = document.body.classList.contains('dark-mode') ? '56, 189, 248' : '14, 165, 233';
                    ctx.strokeStyle = `rgba(${color},` + opacityValue * 0.15 + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    function initParticles() {
        particles = [];
        const count = (window.innerWidth * window.innerHeight) / 15000;
        for (let i = 0; i < count; i++) particles.push(new Particle());
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        connect();
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initParticles();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
    window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; });

    window.onload = () => {
        resize();
        animate();
        startTimer();
        setGreeting();
        document.getElementById('main-frame').onload = handleIframeLoad;
        switchModule('intake');
    };
  </script>
</body>
</html>
