<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Synchronization Suite | OHS Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style id="theme-variables">
    :root {
      --theme-primary: #2563eb;
      --theme-accent: #60a5fa;
      --theme-bubble: 37, 99, 235;
      --theme-glow: rgba(37, 99, 235, 0.4);
      --color-navy: #030712;
      --font-header: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --glass: rgba(255, 255, 255, 0.85);
      --glass-mobile: rgba(255, 255, 255, 0.95);
    }
  </style>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: var(--color-navy);
      font-family: var(--font-body);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.5s;
    }
    body.focus-mode { background-color: #000; }
    body.focus-mode nav, body.focus-mode .nav-rail, body.focus-mode .footer-note { opacity: 0; pointer-events: none; }
    body.focus-mode .portal-hub { margin-top: 40px; }

    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

    /* === PORTAL HUB ARCHITECTURE === */
    .portal-hub {
        max-width: 1440px;
        margin: 140px auto 40px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 40px;
        padding: 0 40px;
        transition: margin 0.5s;
    }

    @media (max-width: 1024px) {
        .portal-hub { grid-template-columns: 1fr; margin-top: 100px; padding: 0 15px; gap: 20px; }
    }

    /* Module Navigation Rail */
    .nav-rail {
        position: sticky;
        top: 120px;
        height: fit-content;
        display: flex;
        flex-direction: column;
        gap: 15px;
        transition: opacity 0.5s;
    }

    /* Mobile Swipe Menu */
    @media (max-width: 1024px) {
        .nav-rail { 
            position: relative; top: 0; flex-direction: row; 
            overflow-x: auto; padding-bottom: 10px; scrollbar-width: none;
            margin-bottom: 10px;
        }
        .nav-rail::-webkit-scrollbar { display: none; }
    }

    .doc-module-key {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1.5px solid rgba(255, 255, 255, 0.08);
        padding: 25px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        gap: 15px;
        cursor: pointer;
        transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        color: #94a3b8;
        min-width: 260px;
        flex-shrink: 0;
    }

    .doc-module-key:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .doc-module-key.active {
        background: var(--glass);
        color: var(--color-navy);
        border-color: var(--theme-primary);
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        transform: translateX(10px);
    }
    @media (max-width: 1024px) { 
        .doc-module-key.active { transform: translateY(-3px) translateX(0); } 
        .doc-module-key { padding: 15px 20px; min-width: auto; border-radius: 16px; }
    }

    .status-pulse {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        flex-shrink: 0;
        transition: 0.5s;
    }

    .active .status-pulse { 
        background: var(--theme-primary); 
        box-shadow: 0 0 15px var(--theme-primary);
    }

    .nav-label { display: flex; flex-direction: column; line-height: 1.2; }
    .nav-label strong { font-family: var(--font-header); font-size: 1rem; font-weight: 800; }
    .nav-label span { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; }

    /* Module Viewport */
    .viewport-module {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-radius: 40px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        overflow: hidden;
        box-shadow: 0 50px 120px rgba(0,0,0,0.3);
        min-height: 80vh;
        display: flex; flex-direction: column;
    }
    @media (max-width: 768px) {
        .viewport-module { border-radius: 24px; min-height: 85vh; }
    }

    .form-container { 
        flex-grow: 1;
        width: 100%; 
        border: none; 
        background: #fff; 
    }

    /* AI Insight Bar */
    .ai-strategy-anchor {
        background: linear-gradient(to right, #f8fafc, #fff);
        padding: 20px 40px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: var(--color-navy);
    }
    .ai-left { display: flex; align-items: center; gap: 20px; }
    
    .ai-orb {
        width: 40px; height: 40px;
        background: var(--theme-primary);
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 15px var(--theme-glow);
        flex-shrink: 0;
        animation: orbBreathe 4s ease-in-out infinite;
    }
    @keyframes orbBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    
    .ai-speech { font-size: 0.9rem; font-weight: 500; line-height: 1.4; }
    .ai-speech strong { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--theme-primary); margin-bottom: 2px; }

    /* Utility Buttons in Header */
    .util-btns { display: flex; gap: 10px; }
    .util-btn {
        padding: 8px 16px; border-radius: 99px;
        font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
        border: 1px solid rgba(0,0,0,0.1); color: #64748b; background: white;
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .util-btn:hover { background: var(--theme-primary); color: white; border-color: var(--theme-primary); }

    @media (max-width: 640px) {
        .ai-strategy-anchor { padding: 15px 20px; flex-direction: column; align-items: flex-start; gap: 15px; }
        .util-btns { width: 100%; justify-content: space-between; }
        .util-btn { flex: 1; justify-content: center; }
        .ai-speech { font-size: 0.85rem; }
    }

    /* Global Nav Navigation */
    nav.fixed-nav {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 40px); max-width: 1400px; z-index: 1000;
      background: var(--glass); backdrop-filter: blur(30px);
      border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.7);
      padding: 10px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      transition: opacity 0.5s;
    }
    .brand { font-family: var(--font-header); font-weight: 900; font-size: 1.2rem; color: var(--color-navy); text-decoration: none; letter-spacing: -0.02em; }
    .brand span { color: var(--theme-primary); }

    .secure-footer { margin-top: 50px; text-align: center; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.4; padding-bottom: 40px; transition: opacity 0.5s; }

  </style>
</head>
<body onmousemove="updateMouseTracker(event)">

  <!-- REACTIVE BUBBLE CANVAS -->
  <canvas id="bubble-canvas"></canvas>

  <nav class="fixed-nav">
    <a href="index.html" class="brand">Olympian <span>Health</span></a>
    <div class="flex gap-6">
        <a href="index.html" class="text-[10px] font-black uppercase tracking-widest text-slate-500 no-underline hover:text-blue-600 transition-colors">Home</a>
        <a href="booking.html" class="text-[10px] font-black uppercase tracking-widest text-slate-500 no-underline hover:text-blue-600 transition-colors">Schedule Session</a>
    </div>
  </nav>

  <div class="portal-hub">
      
      <!-- MOBILE-READY NAV RAIL -->
      <div class="nav-rail">
          <div class="doc-module-key active" onclick="loadModule('intake')" id="key-intake">
              <div class="status-pulse"></div>
              <div class="nav-label">
                  <span>Primary Form</span>
                  <strong>General Intake</strong>
              </div>
          </div>
          <div class="doc-module-key" onclick="loadModule('nutrition')" id="key-nutrition">
              <div class="status-pulse"></div>
              <div class="nav-label">
                  <span>Optional</span>
                  <strong>Nutrition Audit</strong>
              </div>
          </div>
          <div class="doc-module-key" onclick="loadModule('waiver')" id="key-waiver">
              <div class="status-pulse"></div>
              <div class="nav-label">
                  <span>Required</span>
                  <strong>Safety Waiver</strong>
              </div>
          </div>
      </div>

      <!-- INTELLIGENT VIEWPORT -->
      <div class="viewport-module" id="viewport">
          
          <!-- AI HEADER -->
          <div class="ai-strategy-anchor">
              <div class="ai-left">
                  <div class="ai-orb">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  </div>
                  <div class="ai-speech">
                      <strong>Clinical Context</strong>
                      <span id="ai-insight-text">Loading intake protocols...</span>
                  </div>
              </div>
              <div class="util-btns">
                  <button class="util-btn" onclick="toggleFocusMode()">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/></svg>
                      Focus Mode
                  </button>
                  <button class="util-btn" onclick="copyLink()">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                      Share
                  </button>
              </div>
          </div>

          <!-- EMBEDDED FORM -->
          <iframe id="doc-iframe" class="form-container" src="https://docs.google.com/forms/d/e/1FAIpQLSdktzd8imbMzhFPlwbio76bLBl4nY2mhqJDwoISpD16jmqucA/viewform?embedded=true">
              Loading...
          </iframe>
      </div>

  </div>

  <div class="secure-footer footer-note">HIPAA Compliant Google Workspace • 256-bit Encryption</div>

  <script>
    const apiKey = ""; // Environment

    // FORM DATABASE
    const moduleBank = {
        intake: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSdktzd8imbMzhFPlwbio76bLBl4nY2mhqJDwoISpD16jmqucA/viewform?embedded=true",
            objective: "establishing your medical baseline and safety profile."
        },
        nutrition: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSfirjow4l1d38-MvewY07lLW-eS6aTmZIMGTpB_Yle4OiHGEQ/viewform?embedded=true", 
            objective: "fueling your cellular recovery and energy systems."
        },
        waiver: {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSfirjow4l1d38-MvewY07lLW-eS6aTmZIMGTpB_Yle4OiHGEQ/viewform?embedded=true", 
            objective: "confirming our mutual commitment to safe practice."
        }
    };

    function loadModule(key) {
        const iframe = document.getElementById('doc-iframe');
        
        // Reset Active States
        document.querySelectorAll('.doc-module-key').forEach(k => k.classList.remove('active'));
        const activeKey = document.getElementById(`key-${key}`);
        if(activeKey) activeKey.classList.add('active');

        // Iframe Transition
        iframe.style.opacity = '0.3';
        setTimeout(() => {
            iframe.src = moduleBank[key].url;
            iframe.style.opacity = '1';
        }, 300);

        syncAIPartner(key);
    }

    async function syncAIPartner(key) {
        const textEl = document.getElementById('ai-insight-text');
        textEl.style.opacity = "0.4";
        
        const info = moduleBank[key].objective;
        const prompt = `Form Context: ${info}. Write a short, encouraging sentence for a senior client explaining why this specific form helps us build a safer, better plan for them. 20 words max.`;
        const system = "You are a warm, professional Clinical Specialist.";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: system }] }
                })
            });
            const result = await response.json();
            textEl.textContent = result.candidates[0].content.parts[0].text;
        } catch (e) {
            textEl.textContent = `This information is vital for ${info}`;
        }
        textEl.style.opacity = "1";
    }

    // Toggle Focus Mode
    function toggleFocusMode() {
        document.body.classList.toggle('focus-mode');
    }

    // Copy Link
    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("Link copied to clipboard!");
        });
    }

    // --- BUBBLE ENGINE ---
    const canvas = document.getElementById('bubble-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, bubbles = [];
    let mouse = { x: -1000, y: -1000 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initBubbles();
    }

    class Bubble {
      constructor() { this.reset(); }
      reset() {
        this.r = Math.random() * 20 + 8;
        this.x = Math.random() * width;
        this.y = height + this.r + Math.random() * 500;
        this.vx = (Math.random() - 0.5) * 1;
        this.vy = -(Math.random() * 1.4 + 0.6);
        this.opacity = Math.random() * 0.15 + 0.05;
      }
      update() {
        this.y += this.vy; this.x += this.vx;
        const dx = mouse.x - this.x; const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
            const force = (150 - dist) / 150;
            this.x -= dx * force * 0.06; this.y -= dy * force * 0.06;
        }
        if (this.y < -this.r) this.reset();
      }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(37, 99, 235, ${this.opacity})`; ctx.fill();
      }
    }

    function initBubbles() { bubbles = Array.from({length: 45}, () => new Bubble()); }
    function animate() {
      ctx.clearRect(0, 0, width, height);
      bubbles.forEach(b => { b.update(); b.draw(); });
      requestAnimationFrame(animate);
    }

    function updateMouseTracker(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
    window.onresize = resize;

    window.onload = () => {
        resize(); animate();
        loadModule('intake'); // Default load
    };
  </script>
</body>
</html>
