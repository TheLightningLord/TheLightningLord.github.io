<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neural Sync Pro | OHS Elite Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --theme-primary: #2563eb;
      --theme-accent: #60a5fa;
      --theme-danger: #ef4444;
      --theme-glow: rgba(37, 99, 235, 0.4);
      --color-navy: #030712;
      --glass: rgba(255, 255, 255, 0.08);
      --font-header: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: var(--color-navy);
      font-family: var(--font-body);
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }

    canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

    #game-container {
      position: relative;
      width: 100vw; height: 100vh;
      z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px;
    }

    /* Precision Glass Panels */
    .glass-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }

    /* Node Styles */
    .node-base {
      position: absolute;
      width: 90px; height: 90px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: opacity 0.3s;
    }

    /* Impulse Node (Tap) */
    .node-impulse {
      background: radial-gradient(circle at center, var(--theme-accent) 0%, transparent 80%);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
    .ring-timer {
      position: absolute; inset: -15px;
      border: 3px solid var(--theme-primary);
      border-radius: 50%;
      opacity: 0.5;
    }

    /* Integration Node (Hold) */
    .node-hold {
      background: radial-gradient(circle at center, #10b981 0%, transparent 80%);
      border: 3px dashed #10b981;
    }
    .hold-progress {
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 4px solid #10b981;
        clip-path: inset(100% 0 0 0);
        transition: clip-path 0.1s linear;
    }

    /* Noise Node (Don't tap) */
    .node-noise {
      background: radial-gradient(circle at center, var(--theme-danger) 0%, transparent 80%);
      border: 2px solid var(--theme-danger);
      filter: saturate(1.5) contrast(1.2);
    }
    .node-noise::after {
        content: '!'; font-weight: 900; color: #fff; font-size: 2rem;
    }

    /* Global UI Elements */
    #energy-bar-wrap {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        width: calc(100% - 60px); max-width: 600px;
        height: 12px; background: rgba(255,255,255,0.1);
        border-radius: 20px; overflow: hidden; z-index: 100;
        border: 1px solid rgba(255,255,255,0.05);
    }
    #energy-fill {
        width: 100%; height: 100%;
        background: linear-gradient(to right, #ef4444, #3b82f6, #10b981);
        transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-action {
      background: var(--theme-primary);
      padding: 20px 40px; border-radius: 99px;
      font-weight: 900; font-family: var(--font-header);
      text-transform: uppercase; letter-spacing: 0.1em;
      box-shadow: 0 15px 35px var(--theme-glow);
      transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .score-popup {
      position: absolute; font-weight: 900; font-family: var(--font-header);
      font-size: 1.4rem; pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 50; text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    @keyframes floatUp { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-80px) scale(1.2); opacity: 0; } }

    .ai-box {
        margin-top: 25px; padding: 25px;
        background: rgba(var(--theme-bubble), 0.05);
        border: 1px solid rgba(var(--theme-bubble), 0.2);
        border-radius: 24px; text-align: left;
        display: none; font-size: 0.85rem; line-height: 1.6;
    }
    .ai-box.active { display: block; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .ai-loading { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--theme-accent); margin: 0 3px; animation: aiBounce 0.6s infinite alternate; }
    .ai-loading:nth-child(2) { animation-delay: 0.2s; }
    .ai-loading:nth-child(3) { animation-delay: 0.4s; }
    @keyframes aiBounce { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

    #stats-overlay { position: fixed; top: 40px; left: 40px; z-index: 100; font-family: var(--font-header); }
    .rank-badge { padding: 6px 14px; background: rgba(255,255,255,0.08); border-radius: 8px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 10px; display: inline-block; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <!-- DYNAMIC NEURAL FLOW -->
  <canvas id="flow-canvas"></canvas>

  <div id="stats-overlay">
      <div class="rank-badge" id="player-rank">Neural Awakening</div>
      <div class="text-4xl font-black tabular-nums" id="score-display">0000</div>
      <div class="flex items-center gap-3 mt-2">
          <div class="text-[10px] font-black uppercase tracking-widest opacity-40">System Accuracy</div>
          <div class="text-xs font-bold text-blue-400" id="accuracy-display">100%</div>
      </div>
  </div>

  <div id="energy-bar-wrap"><div id="energy-fill"></div></div>

  <div id="game-container">
    <!-- START SCREEN -->
    <div id="start-screen" class="glass-panel text-center">
      <div class="mb-8">
          <div class="w-20 h-20 bg-blue-600/20 rounded-3xl mx-auto flex items-center justify-center mb-6 border border-blue-500/30">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </div>
          <h1 class="text-4xl font-black mb-4">Neural Sync <span class="text-blue-500 text-lg align-top">PRO</span></h1>
          <p class="text-sm opacity-60 leading-relaxed px-4">Master your reflexes across three synaptic challenges. Maintain your vitality levels to achieve elite performance.</p>
      </div>
      
      <div class="grid grid-cols-3 gap-3 mb-8">
          <div class="p-3 bg-white/5 rounded-2xl border border-white/10"><div class="w-2 h-2 bg-blue-500 rounded-full mx-auto mb-2"></div><span class="text-[9px] font-black uppercase">Tap</span></div>
          <div class="p-3 bg-white/5 rounded-2xl border border-white/10"><div class="w-2 h-2 bg-emerald-500 rounded-full mx-auto mb-2"></div><span class="text-[9px] font-black uppercase">Hold</span></div>
          <div class="p-3 bg-white/5 rounded-2xl border border-white/10"><div class="w-2 h-2 bg-red-500 rounded-full mx-auto mb-2"></div><span class="text-[9px] font-black uppercase">Avoid</span></div>
      </div>

      <button class="btn-action w-full" onclick="game.start()">Initialize Sync</button>
      
      <button class="text-[10px] font-black uppercase tracking-[0.2em] mt-8 opacity-40 hover:opacity-100 transition-opacity" onclick="askCoach('focus')">Request Expert Training Focus ✨</button>
      <div id="ai-focus-box" class="ai-box italic"></div>
    </div>

    <!-- PLAY AREA -->
    <div id="play-area" class="hidden absolute inset-0"></div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over" class="hidden glass-panel text-center">
      <h2 class="text-2xl font-black mb-2">Neural Map Complete</h2>
      <div class="text-6xl font-black text-blue-400 mb-2" id="final-score">0</div>
      <div class="text-[10px] font-black uppercase tracking-widest opacity-40 mb-8" id="final-rank-name">NEURAL AWAKENING</div>
      
      <div class="space-y-4">
          <div id="ai-analysis-box" class="ai-box active">
              <div class="flex justify-center py-4"><div class="ai-loading"></div><div class="ai-loading"></div><div class="ai-loading"></div></div>
          </div>

          <button class="btn-action w-full" onclick="location.reload()">Re-Sync System</button>
          <a href="booking.html" class="block text-xs font-bold uppercase tracking-widest py-4 opacity-50 hover:opacity-100 transition-opacity">Schedule Advanced Training</a>
      </div>
    </div>
  </div>

  <script>
    const apiKey = ""; // Environment provided

    // --- GEMINI INTELLIGENCE ---
    async function fetchGemini(prompt, systemInstruction) {
        let delay = 1000;
        for (let i = 0; i < 3; i++) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });
                if (!response.ok) throw new Error();
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (err) {
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
        }
        return "Coach is offline but cheering you on!";
    }

    async function askCoach(type) {
        if (type === 'focus') {
            const box = document.getElementById('ai-focus-box');
            box.innerHTML = `<div class="flex justify-center py-2"><div class="ai-loading"></div><div class="ai-loading"></div><div class="ai-loading"></div></div>`;
            box.classList.add('active');
            const insight = await fetchGemini(
                "Provide one high-level neurological focus for senior mobility today. 15 words max.",
                "You are an Elite Senior Longevity Coach at OHS."
            );
            box.innerHTML = `<strong>Expert Focus:</strong> "${insight}"`;
        }
        if (type === 'analysis') {
            const box = document.getElementById('ai-analysis-box');
            const data = game.getPerformanceData();
            const insight = await fetchGemini(
                `Analyze performance: Score ${data.score}, Accuracy ${data.accuracy}%, Max Combo ${data.combo}. Explain how improving inhibition (ignoring red nodes) and integration (hold nodes) prevents falls and improves cognitive speed in seniors. 2 sentences.`,
                "You are a Doctor of Physical Therapy specializing in geriatric neuroplasticity."
            );
            box.innerHTML = `<strong>Physiological Analysis:</strong> ${insight}`;
        }
    }

    // --- NEURAL FLOW (REACTIONARY) ---
    const canvas = document.getElementById('flow-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, waves = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      waves = Array.from({length: 4}, (_, i) => ({
          y: height * (0.2 + (i * 0.2)),
          length: 0.001, amplitude: 40, frequency: 0.01, phase: Math.random() * 10
      }));
    }

    function animateBg() {
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, width, height);
        let themeRGB = getComputedStyle(document.documentElement).getPropertyValue('--theme-bubble').trim();
        const intensity = game.isActive ? (game.combo > 10 ? 3 : 1) : 1;

        waves.forEach((wave, i) => {
            ctx.beginPath();
            ctx.moveTo(0, wave.y);
            for(let x = 0; x < width; x++) {
                const y = wave.y + Math.sin(x * wave.length + wave.phase) * (wave.amplitude * intensity) * Math.sin(wave.phase);
                ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `rgba(${themeRGB}, ${0.15 - (i * 0.02)})`;
            ctx.lineWidth = intensity > 1 ? 300 : 200;
            ctx.lineCap = 'round';
            ctx.stroke();
            wave.phase += wave.frequency * intensity;
        });
        requestAnimationFrame(animateBg);
    }

    // --- MINI-GAME LOGIC (PROFESSIONAL GRADE) ---
    class Game {
        constructor() {
            this.score = 0; this.combo = 0; this.isActive = false;
            this.energy = 100; this.hits = 0; this.totalSpawned = 0;
            this.maxCombo = 0;
            this.playArea = document.getElementById('play-area');
        }

        start() {
            this.isActive = true;
            document.getElementById('start-screen').classList.add('hidden');
            this.playArea.classList.remove('hidden');
            this.spawnLoop();
        }

        getPerformanceData() {
            return {
                score: this.score,
                combo: this.maxCombo,
                accuracy: Math.round((this.hits / Math.max(1, this.totalSpawned)) * 100)
            };
        }

        spawnLoop() {
            if(!this.isActive) return;
            this.createNode();
            const delay = Math.max(400, 1400 - (this.score / 12));
            setTimeout(() => this.spawnLoop(), delay);
        }

        createNode() {
            const types = ['impulse', 'impulse', 'hold', 'noise'];
            const type = types[Math.floor(Math.random() * types.length)];
            const node = document.createElement('div');
            node.className = `node-base node-${type}`;
            
            this.totalSpawned++;
            const size = 90;
            const x = Math.random() * (width - size - 40) + 20;
            const y = Math.random() * (height - size - 150) + 100;
            node.style.left = `${x}px`; node.style.top = `${y}px`;
            
            // Movement/Drift for difficulty
            let dx = (Math.random() - 0.5) * (this.score / 500);
            let dy = (Math.random() - 0.5) * (this.score / 500);

            let progress = 0;
            const speed = 0.006 + (Math.random() * 0.008) + (this.score / 10000);
            
            const ring = document.createElement('div');
            if(type === 'impulse') {
                ring.className = 'ring-timer';
                node.appendChild(ring);
            }

            const holdBar = document.createElement('div');
            if(type === 'hold') {
                holdBar.className = 'hold-progress';
                node.appendChild(holdBar);
            }

            let isHolding = false;
            let holdStartTime = 0;

            const update = () => {
                if(!node.parentElement || !this.isActive) return;
                
                // Drift
                node.style.left = (parseFloat(node.style.left) + dx) + 'px';
                node.style.top = (parseFloat(node.style.top) + dy) + 'px';

                progress += speed;
                if(type === 'impulse') {
                    const scale = 2 - (progress * 1.5);
                    ring.style.transform = `scale(${scale})`;
                    if(progress >= 1.2) this.handleMiss(node);
                    else requestAnimationFrame(update);
                } else if(type === 'hold') {
                    if(isHolding) {
                        const holdDur = (Date.now() - holdStartTime) / 1000;
                        holdBar.style.clipPath = `inset(${100 - (holdDur * 80)}% 0 0 0)`;
                        if(holdDur >= 1.25) this.handleSuccess(node, "INTEGRATED", "#10b981", 150);
                        else requestAnimationFrame(update);
                    } else if(progress >= 1.5) this.handleMiss(node);
                    else requestAnimationFrame(update);
                } else {
                    // Noise stays for a while then leaves
                    if(progress >= 1.0) node.remove();
                    else requestAnimationFrame(update);
                }
            };

            const trigger = (e) => {
                e.preventDefault();
                if(type === 'noise') {
                    this.handleDissonance(node);
                } else if(type === 'impulse') {
                    this.handleTap(progress, node);
                } else if(type === 'hold') {
                    isHolding = true;
                    holdStartTime = Date.now();
                }
            };

            const release = () => {
                if(type === 'hold' && isHolding) {
                    isHolding = false;
                    this.handleMiss(node);
                }
            };

            node.onmousedown = trigger; node.ontouchstart = trigger;
            node.onmouseup = release; node.ontouchend = release;

            this.playArea.appendChild(node);
            requestAnimationFrame(update);
        }

        handleTap(progress, node) {
            const acc = Math.abs(1 - progress);
            if(acc < 0.15) this.handleSuccess(node, "PERFECT", "#60a5fa", 100);
            else if(acc < 0.4) this.handleSuccess(node, "SYNCED", "#fff", 40);
            else this.handleMiss(node);
        }

        handleSuccess(node, label, color, basePoints) {
            this.hits++;
            this.combo++;
            this.maxCombo = Math.max(this.maxCombo, this.combo);
            this.energy = Math.min(100, this.energy + 2);
            this.score += basePoints * (1 + Math.floor(this.combo / 5));
            this.showPopup(node.offsetLeft, node.offsetTop, label, color);
            this.updateUI();
            node.remove();
        }

        handleMiss(node) {
            this.combo = 0;
            this.energy -= 8;
            this.updateUI();
            node.style.opacity = '0';
            setTimeout(() => node.remove(), 100);
            if(this.energy <= 0) this.end();
        }

        handleDissonance(node) {
            this.combo = 0;
            this.energy -= 20;
            this.showPopup(node.offsetLeft, node.offsetTop, "DISSONANCE", "#ef4444");
            this.updateUI();
            node.remove();
            if(this.energy <= 0) this.end();
        }

        updateUI() {
            document.getElementById('score-display').textContent = this.score.toString().padStart(4, '0');
            document.getElementById('energy-fill').style.width = `${this.energy}%`;
            document.getElementById('accuracy-display').textContent = `${this.getPerformanceData().accuracy}%`;
            
            const ranks = ["Neural Awakening", "Reflex Surge", "Systemic Sync", "Elite Longevity"];
            const rIdx = Math.min(3, Math.floor(this.score / 1500));
            document.getElementById('player-rank').textContent = ranks[rIdx];
        }

        showPopup(x, y, text, color) {
            const p = document.createElement('div');
            p.className = 'score-popup';
            p.style.left = `${x}px`; p.style.top = `${y}px`;
            p.style.color = color; p.textContent = text;
            this.playArea.appendChild(p);
            setTimeout(() => p.remove(), 1000);
        }

        end() {
            this.isActive = false;
            this.playArea.innerHTML = '';
            this.playArea.classList.add('hidden');
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').textContent = this.score;
            document.getElementById('final-rank-name').textContent = document.getElementById('player-rank').textContent;
            askCoach('analysis');
        }
    }

    const game = new Game();
    window.onload = () => { resize(); animateBg(); };
    window.onresize = resize;
  </script>
</body>
</html>
