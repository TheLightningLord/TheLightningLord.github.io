<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympian Health Solutions | Nutrition Hub</title>
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --bg-deep: #0f172a;       /* Dark Metallic Blue */
            --bg-card: #1e293b;       /* Lighter Metallic Blue */
            --bg-card-hover: #334155;
            --accent-silver: #94a3b8; /* Silvery Blue */
            --accent-glow: #38bdf8;   /* Electric Blue/Cyan */
            --accent-gold: #fbbf24;   /* For achievement/Olympian status */
            --text-primary: #f8fafc;  /* White/Near White */
            --text-secondary: #cbd5e1;
            --success: #22c55e;
            --danger: #ef4444;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(148, 163, 184, 0.05) 0%, transparent 20%);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* --- LAYOUT UTILITIES --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-in; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--accent-silver));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            color: var(--accent-glow);
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 5px;
        }

        /* --- DASHBOARD --- */
        .progress-overview {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .user-rank {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-silver);
        }
        
        .user-rank span { color: var(--accent-glow); }

        /* --- LEVEL GRID --- */
        .level-grid {
            display: grid;
            gap: 15px;
        }

        .level-card {
            background: var(--bg-card);
            border: 1px solid rgba(56, 189, 248, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .level-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .level-card:not(.locked):hover {
            transform: translateY(-3px);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .level-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .level-status {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .status-locked { color: var(--accent-silver); }
        .status-open { color: var(--accent-glow); background: rgba(56, 189, 248, 0.1); }
        .status-completed { color: var(--success); background: rgba(34, 197, 94, 0.1); }

        /* --- LEARNING VIEW --- */
        .nav-back {
            background: none;
            border: none;
            color: var(--accent-silver);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .nav-back:hover { color: var(--text-primary); }

        .topic-container {
            display: grid;
            gap: 20px;
        }

        .topic-card {
            background: linear-gradient(180deg, var(--bg-card) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
        }

        .topic-title {
            color: var(--accent-glow);
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 10px;
        }

        .topic-content h4 {
            color: var(--accent-silver);
            margin: 15px 0 5px 0;
            font-size: 1rem;
        }

        .topic-content ul {
            list-style-type: none;
            margin-left: 5px;
        }

        .topic-content li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .topic-content li::before {
            content: "•";
            color: var(--accent-glow);
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .citation {
            display: block;
            margin-top: 4px;
            font-size: 0.75rem;
            color: var(--accent-silver);
            font-style: italic;
            opacity: 0.8;
        }

        .coach-note {
            background: rgba(56, 189, 248, 0.05);
            border-left: 3px solid var(--accent-glow);
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9rem;
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: linear-gradient(90deg, var(--accent-glow), #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-action:hover { opacity: 0.9; }

        /* --- QUIZ VIEW --- */
        .quiz-question {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .quiz-options {
            display: grid;
            gap: 10px;
        }

        .quiz-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            padding: 15px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-silver);
        }

        .quiz-btn.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .quiz-btn.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }

        .quiz-feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        /* FOOTER & SECRET CODE */
        .dashboard-footer {
            margin-top: 50px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .reset-btn:hover { opacity: 1; background: rgba(239, 68, 68, 0.1); }

        .secret-area {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .secret-area:hover { opacity: 1; }

        .secret-input {
            background: var(--bg-deep);
            border: 1px solid var(--bg-card-hover);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: 150px;
        }
        .secret-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent-silver);
            color: var(--accent-silver);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Responsive */
        @media (min-width: 600px) {
            .level-grid { grid-template-columns: repeat(2, 1fr); }
            .level-card:last-child { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-title">Olympian Health</div>
            <div class="brand-subtitle">Advanced Nutritional Coaching Hub</div>
        </header>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="fade-in">
            <div class="progress-overview">
                <div>
                    <div style="font-size: 0.8rem; color: var(--accent-silver); text-transform: uppercase;">Current Rank</div>
                    <div class="user-rank" id="user-rank">Rookie</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.8rem; color: var(--accent-silver);">Progress</div>
                    <div style="color: var(--text-primary); font-weight: bold;"><span id="levels-completed">0</span>/5 Levels</div>
                </div>
            </div>

            <div class="level-grid" id="level-grid">
                <!-- Levels will be injected here via JS -->
            </div>
            
            <div class="dashboard-footer">
                <button class="reset-btn" onclick="app.resetProgress()">Reset All Progress</button>
                <div class="secret-area">
                    <input type="password" id="secret-code" class="secret-input" placeholder="Coach Access Code">
                    <button class="secret-btn" onclick="app.checkSecretCode()">Unlock</button>

            </div>
        </div>

        <!-- LEARNING VIEW -->
        <div id="view-learn" class="hidden fade-in">
            <button class="nav-back" onclick="app.showDashboard()">← Back to Dashboard</button>
            <h2 id="learn-title" style="margin-bottom: 20px; color: var(--text-primary);"></h2>
            <div class="topic-container" id="learn-content">
                <!-- Content injected here -->
            </div>
            <button class="btn-action" onclick="app.startQuiz()">Take Assessment</button>
        </div>

        <!-- QUIZ VIEW -->
        <div id="view-quiz" class="hidden fade-in">
            <button class="nav-back" onclick="app.showDashboard()">← Quit Assessment</button>
            <div style="margin-bottom: 10px; color: var(--accent-glow); font-size: 0.9rem;">Question <span id="q-current">1</span>/<span id="q-total">3</span></div>
            <div id="quiz-container">
                <div class="quiz-question" id="quiz-question"></div>
                <div class="quiz-options" id="quiz-options"></div>
                <div id="quiz-feedback" class="quiz-feedback hidden"></div>
                <button id="btn-next-q" class="btn-action hidden" onclick="app.nextQuestion()">Next Question</button>
                <button id="btn-finish-quiz" class="btn-action hidden" onclick="app.finishQuiz()">Complete Level</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA SOURCE ---
        const contentData = [
            {
                id: 1,
                title: "I. Foundations of Energy",
                rankName: "Apprentice",
                desc: "Rethinking Calories & NEAT",
                topics: [
                    {

                            "<span class='citation'>Hall, K. D., et al. (2011). Quantification of the effect of energy imbalance on bodyweight. The Lancet.</span>",
                            "Energy expenditure is not static; it adapts downward during deficits through hormonal regulation (Leptin/Thyroid) and reduced body mass.",
                            "<span class='citation'>Leibel, R. L., Rosenbaum, M., & Hirsch, J. (1995). Changes in energy expenditure resulting from altered body weight. NEJM.</span>"

                            "Chronic high-intensity cardio can interfere with muscle hypertrophy pathways (mTOR vs AMPK conflict), leading to a 'skinny fat' outcome if resistance training is neglected.",

                quiz: [

            {

                            "Key Drivers: Reduced conversion of T4 (inactive thyroid) to T3 (active thyroid), and increased skeletal muscle work efficiency (burning fewer calories for the same movement).",

                ]
            },
            {
                id: 3,
                title: "III. Muscle & Hormones",
                rankName: "Specialist",
                desc: "Protein Synthesis & Regulation",
                topics: [
                    {
                        title: "1. The Leucine Threshold",
                        points: [
                            "Muscle Protein Synthesis (MPS) is 'triggered' by intracellular leucine concentrations. A bolus of ~2-3g Leucine is required to saturate the system.",

                            "This equates to roughly 25-35g of high-quality protein per meal. Spiking MPS 3-4 times daily is superior to 1 giant meal or 6 tiny ones.",

                    {

        // --- APP LOGIC ---
        const app = {
            state: {
                unlockedLevel: 1,
                currentLevelViewing: null,
                currentQuizIndex: 0,
                quizScore: 0
            },

            init: function() {
                this.loadState();
                this.renderDashboard();
            },

            loadState: function() {
                const saved = localStorage.getItem('olympianData');
                if (saved) {
                    this.state = JSON.parse(saved);
                }
            },

            saveState: function() {
                localStorage.setItem('olympianData', JSON.stringify(this.state));
            },

            resetProgress: function() {
                if(confirm("Reset all learning progress?")) {
                    localStorage.removeItem('olympianData');
                    location.reload();
                }
            },

            // --- SECRET CODE LOGIC ---
            checkSecretCode: function() {
                const input = document.getElementById('secret-code');
                const code = input.value.trim().toUpperCase();
                
                if (code === "CICO") {
                    this.state.unlockedLevel = 6; // Unlock all (above max ID)
                    this.saveState();
                    alert("🔓 ACCESS GRANTED: Protocol CICO Active.\n\nAll Olympian Knowledge Levels Unlocked.");
                    this.renderDashboard();
                    input.value = "";
                } else {
                    alert("⛔ ACCESS DENIED: Incorrect Code.");
                    input.value = "";
                }
            },

            renderDashboard: function() {
                const grid = document.getElementById('level-grid');
                grid.innerHTML = '';
                
                let currentRank = "Rookie";
                
                contentData.forEach((level, index) => {
                    const isUnlocked = level.id <= this.state.unlockedLevel;
                    const isCompleted = level.id < this.state.unlockedLevel;
                    
                    // Update Rank Name based on highest unlocked
                    if (level.id === this.state.unlockedLevel) currentRank = level.rankName;
                    if (this.state.unlockedLevel > 5) currentRank = "Olympian Coach";

                    const statusClass = isCompleted ? 'status-completed' : (isUnlocked ? 'status-open' : 'status-locked');
                    const statusText = isCompleted ? 'Mastered' : (isUnlocked ? 'In Progress' : 'Locked');
                    const cardClass = isUnlocked ? 'level-card' : 'level-card locked';
                    const lockIcon = isUnlocked ? '' : '🔒 ';

                    const card = document.createElement('div');
                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="level-header">
                            <span class="level-title">${lockIcon}${level.title}</span>
                            <span class="level-status ${statusClass}">${statusText}</span>
                        </div>
                        <div style="color: var(--accent-silver); font-size: 0.9rem;">${level.desc}</div>
                    `;

                    if (isUnlocked) {
                        card.onclick = () => this.loadLevel(level.id);
                    }

                    grid.appendChild(card);
                });

                document.getElementById('user-rank').innerHTML = currentRank;
                document.getElementById('levels-completed').innerText = Math.min(this.state.unlockedLevel - 1, 5);

                this.switchView('view-dashboard');
            },

            loadLevel: function(levelId) {
                this.state.currentLevelViewing = levelId;
                const data = contentData.find(l => l.id === levelId);
                
                document.getElementById('learn-title').innerText = data.title;
                const contentContainer = document.getElementById('learn-content');
                contentContainer.innerHTML = '';

                data.topics.forEach(topic => {
                    let pointsHtml = topic.points.map(p => `<li>${p}</li>`).join('');
                    let noteHtml = topic.coachNote ? `<div class="coach-note"><strong>💡 Coach's Eye:</strong> ${topic.coachNote}</div>` : '';
                    
                    const div = document.createElement('div');
                    div.className = 'topic-card';
                    div.innerHTML = `
                        <div class="topic-title">${topic.title}</div>
                        <div class="topic-content">
                            <ul>${pointsHtml}</ul>
                            ${noteHtml}
                        </div>
                    `;
                    contentContainer.appendChild(div);
                });

                this.switchView('view-learn');
            },

            startQuiz: function() {
                this.state.currentQuizIndex = 0;
                this.state.quizScore = 0;
                this.renderQuizQuestion();
                this.switchView('view-quiz');
            },

            renderQuizQuestion: function() {
                const levelData = contentData.find(l => l.id === this.state.currentLevelViewing);
                const qData = levelData.quiz[this.state.currentQuizIndex];

                document.getElementById('q-current').innerText = this.state.currentQuizIndex + 1;
                document.getElementById('q-total').innerText = levelData.quiz.length;
                document.getElementById('quiz-question').innerText = qData.q;
                
                const optionsContainer = document.getElementById('quiz-options');
                optionsContainer.innerHTML = '';
                
                // Hide feedback and next buttons
                document.getElementById('quiz-feedback').classList.add('hidden');
                document.getElementById('btn-next-q').classList.add('hidden');
                document.getElementById('btn-finish-quiz').classList.add('hidden');

                qData.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn';
                    btn.innerText = opt;
                    btn.onclick = () => this.checkAnswer(idx, btn);
                    optionsContainer.appendChild(btn);
                });
            },

            checkAnswer: function(selectedIndex, btnElement) {
                // Prevent multiple clicks
                const allBtns = document.querySelectorAll('.quiz-btn');
                allBtns.forEach(b => b.disabled = true);

                const levelData = contentData.find(l => l.id === this.state.currentLevelViewing);
                const qData = levelData.quiz[this.state.currentQuizIndex];

                const feedback = document.getElementById('quiz-feedback');
                feedback.classList.remove('hidden');

                if (selectedIndex === qData.correct) {
                    btnElement.classList.add('correct');
                    feedback.innerText = "✓ " + qData.expl;
                    feedback.style.border = "1px solid var(--success)";
                    feedback.style.color = "var(--success)";
                    this.state.quizScore++;
                } else {
                    btnElement.classList.add('incorrect');
                    // Highlight correct one
                    allBtns[qData.correct].classList.add('correct');
                    feedback.innerText = "✗ " + qData.expl;
                    feedback.style.border = "1px solid var(--danger)";
                    feedback.style.color = "var(--danger)";
                }

                // Show next button
                if (this.state.currentQuizIndex < levelData.quiz.length - 1) {
                    document.getElementById('btn-next-q').classList.remove('hidden');
                } else {
                    document.getElementById('btn-finish-quiz').classList.remove('hidden');
                }
            },

            nextQuestion: function() {
                this.state.currentQuizIndex++;
                this.renderQuizQuestion();
            },

            finishQuiz: function() {
                const levelData = contentData.find(l => l.id === this.state.currentLevelViewing);
                const passThreshold = Math.ceil(levelData.quiz.length * 0.5); // Need 50% to pass

                if (this.state.quizScore >= passThreshold) {
                    alert(`Assessment Passed! Score: ${this.state.quizScore}/${levelData.quiz.length}\n\nLevel unlocked.`);
                    if (this.state.unlockedLevel === this.state.currentLevelViewing) {
                        this.state.unlockedLevel++;
                        this.saveState();
                    }
                    this.renderDashboard();
                } else {
                    alert(`Assessment Failed. Score: ${this.state.quizScore}/${levelData.quiz.length}\n\nReview the material and try again.`);
                    this.renderDashboard(); // Or reload level
                }
            },

            showDashboard: function() {
                this.renderDashboard();
            },

            switchView: function(viewId) {
                ['view-dashboard', 'view-learn', 'view-quiz'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
                document.getElementById(viewId).classList.remove('hidden');
                window.scrollTo(0, 0);
            }
        };

        // Initialize
        app.init();

    </script>
</body>
</html>
