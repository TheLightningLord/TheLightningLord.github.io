<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Schedule your vitality session with Olympian Health Solutions." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Schedule Your Visit | Olympian Health Solutions</title>

  <!-- Modern Luxury Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style id="theme-variables">
    :root {
      --theme-primary: #2563eb;
      --theme-accent: #60a5fa;
      --theme-bg-end: #ebf5ff;
      --theme-bubble: 37, 99, 235;
      --theme-glow: rgba(37, 99, 235, 0.4);
      --color-navy: #030712;
      --color-frost: #f8fafc;
      --color-white: #ffffff;
      --font-header: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --glass: rgba(255, 255, 255, 0.82);
      --radius-full: 999px;
      --shadow-luxe: 0 20px 50px rgba(0,0,0,0.04);
    }
  </style>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html { scroll-behavior: smooth; font-size: 16px; overflow-x: hidden; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--color-navy);
      background-color: var(--color-frost);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 { font-family: var(--font-header); margin: 0; line-height: 1.1; letter-spacing: -0.03em; }

    /* Background Animation */
    .bg-animation {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, var(--theme-bg-end) 100%);
    }
    #flow-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.4; }

    /* Navigation */
    nav {
      position: fixed;
      top: 15px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 20px); max-width: 1200px;
      z-index: 2000;
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: var(--radius-full);
      border: 1px solid rgba(255,255,255,0.7);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-luxe);
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { width: 48px; height: 36px; background: var(--color-navy); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 0.8rem; }
    .brand-name { font-weight: 900; font-size: 1.1rem; color: var(--color-navy); font-family: var(--font-header); }
    .btn-pill { padding: 10px 24px; border-radius: var(--radius-full); font-weight: 800; font-size: 0.75rem; text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em; background: var(--color-navy); color: #fff; }

    /* Hero */
    .hero {
      padding: 140px 24px 40px;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }
    .hero h1 { font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 900; margin-bottom: 1rem; }
    .hero p { font-size: 1.1rem; color: #64748b; font-weight: 500; }

    /* Contact Infographic */
    .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto 60px;
        padding: 0 24px;
    }
    .contact-card {
        background: #fff;
        padding: 30px;
        border-radius: 30px;
        border: 1.5px solid #f1f5f9;
        display: flex;
        align-items: center;
        gap: 20px;
        transition: 0.4s;
        box-shadow: var(--shadow-luxe);
        text-decoration: none;
        color: inherit;
    }
    .contact-card:hover {
        border-color: var(--theme-primary);
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(var(--theme-bubble), 0.1);
    }
    .contact-icon {
        width: 54px; height: 54px;
        background: var(--theme-bg-end);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .contact-icon svg { width: 24px; height: 24px; color: var(--theme-primary); }
    .contact-info strong { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 2px; }
    .contact-info span { font-weight: 800; font-size: 1.1rem; color: var(--color-navy); }

    /* Scheduler Container */
    .scheduler-section {
        max-width: 1000px;
        margin: 0 auto 100px;
        padding: 0 24px;
    }
    .scheduler-frame {
        background: rgba(255,255,255,0.6);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-radius: 40px;
        border: 1.5px solid rgba(255,255,255,0.8);
        overflow: hidden;
        box-shadow: var(--shadow-luxe);
    }

    footer { padding: 40px 24px; text-align: center; opacity: 0.5; font-size: 0.8rem; }

    .reveal { opacity: 0; transform: translateY(20px); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.active { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
        .hero { padding-top: 120px; }
        .contact-grid { grid-template-columns: 1fr; }
        .contact-card { padding: 20px; }
        .contact-info span { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="bg-animation">
    <canvas id="flow-canvas"></canvas>
  </div>

  <nav>
    <a href="booking.html" class="brand">
      <div class="logo-mark">OHS</div>
      <span class="brand-name">Olympian Health</span>
    </a>
    <a href="booking.html" class="btn-pill">Back</a>
  </nav>

  <header class="hero reveal active">
    <h1>Secure Your <span>Time</span></h1>
    <p>Choose a slot below for your first visit or a quick chat. We'll handle the rest!</p>
  </header>

  <section class="contact-grid reveal active">
    <!-- Phone Card -->
    <a href="tel:+10000000000" class="contact-card">
        <div class="contact-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div class="contact-info">
            <strong>Call or Text</strong>
            <span>(360) 901-5232</span>
        </div>
    </a>

    <!-- Email Card -->
    <a href="mailto:hello@olympianhealth.com" class="contact-card">
        <div class="contact-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div class="contact-info">
            <strong>Send an Email</strong>
            <span>hello@olympianhealth.com</span>
        </div>
    </a>
  </section>

  <section class="scheduler-section reveal active">
    <div class="scheduler-frame">
        <!-- Calendly inline widget begin -->
        <div class="calendly-inline-widget" data-url="https://calendly.com/zeustrength/30min" style="min-width:320px;height:700px;"></div>
        <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
        <!-- Calendly inline widget end -->
    </div>
  </section>

  <footer>
    &copy; 2024 Olympian Health Solutions. Mobile Senior Vitality Specialists. Clark County, WA.
  </footer>

  <script>
    // Background Animation
    const canvas = document.getElementById('flow-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, waves = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initWaves();
    }

    function initWaves() {
      waves = [];
      for(let i = 0; i < 3; i++) {
        waves.push({
          y: height * (0.4 + i * 0.1),
          length: 0.001 + Math.random() * 0.001,
          amplitude: 50 + Math.random() * 50,
          frequency: 0.01 + Math.random() * 0.01,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-bubble').trim();
      waves.forEach((wave, i) => {
        ctx.beginPath(); ctx.moveTo(0, wave.y);
        for(let x = 0; x < width; x++) {
          const y = wave.y + Math.sin(x * wave.length + wave.phase) * wave.amplitude;
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `rgba(${themeColor}, ${0.1 - i * 0.02})`;
        ctx.lineWidth = 120; ctx.lineCap = 'round'; ctx.stroke();
        wave.phase += wave.frequency;
      });
      requestAnimationFrame(animate);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting) entry.target.classList.add('active');
      });
    }, { threshold: 0.1 });

    window.onload = () => {
      resize(); animate();
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    };
    window.onresize = resize;
  </script>
</body>
</html>
