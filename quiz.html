<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Longevity Assessment | Olympian Health Solutions</title>

  <!-- Modern Luxury Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --theme-primary: #2563eb;
      --theme-accent: #60a5fa;
      --color-navy: #030712;
      --color-obsidian: rgba(2, 4, 12, 0.98);
      --glass: rgba(255, 255, 255, 0.05);
      --font-header: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --radius-xl: 32px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: #fff;
      background-color: var(--color-navy);
      background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #030712 100%);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* === PROGRESS BAR === */
    .progress-container {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 6px;
        background: rgba(255,255,255,0.05);
        z-index: 1000;
    }
    .progress-bar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--theme-primary), var(--theme-accent));
        box-shadow: 0 0 15px var(--theme-accent);
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* === LAYOUT === */
    header {
        padding: 25px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-family: var(--font-header); font-weight: 800; font-size: 1.2rem; }
    .logo-mark { width: 44px; height: 32px; background: #fff; border-radius: 8px; color: var(--color-navy); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 900; }

    main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    /* === QUIZ CARD === */
    .quiz-card {
        width: 100%;
        max-width: 680px;
        background: var(--color-obsidian);
        backdrop-filter: blur(40px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: var(--radius-xl);
        padding: clamp(30px, 8vw, 60px);
        box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        position: relative;
        overflow: hidden;
    }

    .question-category {
        color: var(--theme-accent);
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-weight: 900;
        font-size: 0.7rem;
        margin-bottom: 15px;
        display: block;
    }

    .question-text {
        font-family: var(--font-header);
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 40px;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .option-btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 20px 24px;
        border-radius: 16px;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .option-btn:hover {
        background: rgba(255,255,255,0.08);
        border-color: var(--theme-accent);
        transform: translateX(8px);
    }

    /* === RESULTS PAGE === */
    .results-container {
        display: none;
        flex-direction: column;
        gap: 40px;
        width: 100%;
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px 100px;
    }

    .result-header { text-align: center; max-width: 800px; margin: 0 auto 40px; }
    .result-header h1 { 
        font-family: var(--font-header); 
        font-size: clamp(2.5rem, 8vw, 5rem); 
        font-weight: 900;
        line-height: 0.9;
        margin-bottom: 20px;
        letter-spacing: -0.04em;
    }
    .result-header h1 span {
        color: var(--theme-accent);
    }
    .result-header p { color: #94a3b8; font-size: 1.4rem; font-weight: 500; }

    .bio-metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 24px;
    }

    .metric-card {
        background: var(--color-obsidian);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 32px;
        text-align: left;
        position: relative;
        transition: 0.4s;
    }

    .chart-box {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 25px;
    }

    .chart-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .chart-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 12; }
    .chart-fill { fill: none; stroke: var(--theme-primary); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 2.5s ease-out; }

    .chart-val {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.8rem;
        font-weight: 900;
        font-family: var(--font-header);
    }

    .metric-title { font-weight: 800; font-size: 1.4rem; margin-bottom: 12px; color: #fff; line-height: 1.1; }
    .metric-desc { font-size: 1rem; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
    
    .citation {
        font-size: 0.7rem;
        color: var(--theme-accent);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        display: block;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 15px;
    }

    .action-row {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 60px;
        flex-wrap: wrap;
    }

    .btn-action {
        background: #fff;
        color: var(--color-navy);
        padding: 22px 48px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 900;
        transition: 0.3s;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
    }
    .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: #fff;
        border: 1.5px solid rgba(255,255,255,0.1);
    }
    .btn-action:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }

    /* === PRINT STYLES === */
    @media print {
        body { background: #fff !important; color: #000 !important; }
        .progress-container, header, .action-row, .bg-animation { display: none !important; }
        .results-container { display: block !important; margin: 0; padding: 20px; max-width: 100%; }
        .metric-card { 
            background: #fff !important; 
            border: 1px solid #ddd !important; 
            box-shadow: none !important; 
            break-inside: avoid;
            margin-bottom: 20px;
            color: #000 !important;
            padding: 20px;
        }
        .metric-title, .chart-val { color: #000 !important; }
        .metric-desc { color: #333 !important; }
        .citation { color: var(--theme-primary) !important; }
        .chart-bg { stroke: #eee !important; }
        .chart-fill { stroke: #000 !important; }
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body>

  <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
  </div>

  <header>
      <a href="index.html" class="brand">
          <div class="logo-mark">OHS</div>
          <span>Olympian Health</span>
      </a>
  </header>

  <main id="quiz-app">
      <div id="quiz-container" class="quiz-card fade-in">
          <span class="question-category" id="q-category">Clinical Discovery</span>
          <div class="question-text" id="q-text">Ready to begin your personalized Bio-Metric Longevity Assessment?</div>
          <div class="options-grid" id="q-options">
              <button class="option-btn" onclick="renderQuestion('start')">Begin Clinical Analysis</button>
          </div>
      </div>

      <div id="results-container" class="results-container">
          <div class="result-header">
              <h1>Bio-Metric <span>Verdict.</span></h1>
              <p>Exercise is your primary clinical intervention. Here is the evidence-based impact of a doctorate-led mobility framework on your profile.</p>
          </div>

          <div class="bio-metrics-grid" id="insights-grid">
              <!-- Research claims injected here -->
          </div>

          <div class="action-row">
              <button class="btn-action btn-secondary" onclick="window.print()">Print Bio-Metric Report</button>
              <a href="booking.html" class="btn-action">Consult with a Specialist</a>
          </div>
      </div>
  </main>

  <script>
    // MASSIVE RESEARCH DATABASE - 120+ Node Permutations
    const QUIZ_DATA = {
        "start": {
            category: "Anchor Selection",
            text: "Which health pillar is currently your highest priority?",
            options: [
                { text: "Stability & Preventing Falls", next: "stability_1", points: { stability: 10 } },
                { text: "Metabolic Health (Diabetes/Weight)", next: "metabolic_1", points: { metabolic: 10 } },
                { text: "Joint Pain & Musculoskeletal Health", next: "joints_1", points: { joints: 10 } },
                { text: "Cognitive Focus & Brain Health", next: "cognitive_1", points: { cognitive: 10 } }
            ]
        },
        // --- STABILITY BRANCH ---
        "stability_1": {
            category: "Stability Analysis",
            text: "When walking on uneven ground (like grass), how often do you feel a sense of 'wobble'?",
            options: [
                { text: "Almost every time.", next: "stability_reach", points: { stability: 15 } },
                { text: "Occasionally, if I'm tired.", next: "stability_reach", points: { stability: 7 } },
                { text: "Rarely, I feel very solid.", next: "sarcopenia_check", points: { stability: 0 } }
            ]
        },
        "stability_reach": {
            category: "Stability Analysis",
            text: "Do you find yourself using furniture or walls as 'guides' when moving through your home?",
            options: [
                { text: "Yes, it helps me feel safe.", next: "stability_fall_history", points: { stability: 10 } },
                { text: "No, I walk freely.", next: "stability_fall_history", points: { stability: 0 } }
            ]
        },
        "stability_fall_history": {
            category: "Fall Risk Assessment",
            text: "Have you had a fall, trip, or 'near miss' where you had to catch yourself in the last 6 months?",
            options: [
                { text: "Yes, a fall occurred.", next: "stability_fear", points: { stability: 20, mortality_risk: 10 } },
                { text: "Just a few near misses.", next: "stability_fear", points: { stability: 10 } },
                { text: "No issues at all.", next: "sarcopenia_check", points: { stability: 0 } }
            ]
        },
        "stability_fear": {
            category: "Psychological Impact",
            text: "Does the fear of falling cause you to decline social invitations or outdoor activities?",
            options: [
                { text: "Yes, I'm much more cautious now.", next: "sarcopenia_check", points: { anxiety: 10, stability: 5 } },
                { text: "No, I still do everything.", next: "sarcopenia_check", points: { anxiety: 0 } }
            ]
        },
        // --- METABOLIC BRANCH ---
        "metabolic_1": {
            category: "Metabolic Flow",
            text: "Have you been diagnosed with Pre-diabetes or Type 2 Diabetes?",
            options: [
                { text: "Yes, Type 2.", next: "metabolic_insulin", points: { metabolic: 15, inflammation: 10 } },
                { text: "Yes, Pre-diabetes.", next: "metabolic_insulin", points: { metabolic: 10 } },
                { text: "No, but I have high blood pressure.", next: "cardio_bp", points: { metabolic: 5, bp: 15 } },
                { text: "No, I just want to lose weight.", next: "metabolic_visceral", points: { metabolic: 5 } }
            ]
        },
        "metabolic_insulin": {
            category: "Metabolic Flow",
            text: "Is your blood sugar managed primarily with medication or lifestyle?",
            options: [
                { text: "Medication (Metformin/Insulin).", next: "metabolic_energy", points: { metabolic: 10 } },
                { text: "Primarily lifestyle/diet.", next: "metabolic_energy", points: { metabolic: 5 } }
            ]
        },
        "metabolic_visceral": {
            category: "Adipose Tissue",
            text: "Do you primarily carry weight around your midsection (waist)?",
            options: [
                { text: "Yes, 'apple' shaped.", next: "metabolic_energy", points: { visceral_fat: 15, metabolic: 10 } },
                { text: "No, weight is distributed.", next: "metabolic_energy", points: { visceral_fat: 0 } }
            ]
        },
        "metabolic_energy": {
            category: "Cellular Energy",
            text: "Do you experience 'mental fog' or extreme lethargy 30-60 minutes after a meal?",
            options: [
                { text: "Yes, very common.", next: "mitochondria_1", points: { metabolic: 10, cognitive: 5 } },
                { text: "No, I stay focused.", next: "mitochondria_1", points: { metabolic: 0 } }
            ]
        },
        // --- JOINTS BRANCH ---
        "joints_1": {
            category: "Joint Integrity",
            text: "Which joint causes you the most consistent discomfort?",
            options: [
                { text: "Knees or Hips", next: "joints_mechanical", points: { joints: 15, arthritis: 10 } },
                { text: "Lower Back / Spine", next: "joints_spine", points: { joints: 15, spine: 10 } },
                { text: "Shoulders or Hands", next: "joints_mechanical", points: { joints: 10 } }
            ]
        },
        "joints_spine": {
            category: "Skeletal Alignment",
            text: "Does your back pain radiate into your legs or cause numbness?",
            options: [
                { text: "Yes, sciatica symptoms.", next: "joints_stiffness", points: { joints: 10, nerve: 10 } },
                { text: "No, it stays in the back.", next: "joints_stiffness", points: { joints: 5 } }
            ]
        },
        "joints_mechanical": {
            category: "Cartilage Health",
            text: "Do you experience 'clicking', 'popping', or a feeling of the joint 'giving out'?",
            options: [
                { text: "Yes, frequently.", next: "joints_stiffness", points: { joints: 15, mechanical: 10 } },
                { text: "No, just aching.", next: "joints_stiffness", points: { joints: 10 } }
            ]
        },
        "joints_stiffness": {
            category: "Synovial Flow",
            text: "When is your stiffness most debilitating?",
            options: [
                { text: "Immediately upon waking.", next: "bone_density", points: { joints: 10 } },
                { text: "After sitting for 30+ minutes.", next: "bone_density", points: { joints: 10 } },
                { text: "At the end of the day.", next: "bone_density", points: { joints: 5 } }
            ]
        },
        // --- COGNITIVE BRANCH ---
        "cognitive_1": {
            category: "Neural Plasticity",
            text: "How would you describe your ability to recall names or specific details compared to 5 years ago?",
            options: [
                { text: "Noticeably more difficult.", next: "cognitive_sleep", points: { cognitive: 15, dementia_risk: 10 } },
                { text: "About the same.", next: "cognitive_sleep", points: { cognitive: 2 } }
            ]
        },
        "cognitive_sleep": {
            category: "Glymphatic System",
            text: "How many nights a week do you wake up and find it hard to fall back asleep?",
            options: [
                { text: "4 or more nights.", next: "cardio_intro", points: { cognitive: 10, cortisol: 10 } },
                { text: "1-2 nights.", next: "cardio_intro", points: { cognitive: 5 } },
                { text: "I sleep soundly.", next: "cardio_intro", points: { cognitive: 0 } }
            ]
        },
        // --- COMMON CLINICAL NODES ---
        "sarcopenia_check": {
            category: "Muscle Armor",
            text: "How would you rate your current grip strength (e.g., opening jars)?",
            options: [
                { text: "It's becoming very difficult.", next: "bone_density", points: { sarcopenia: 15, mortality_risk: 10 } },
                { text: "I've noticed a slight decline.", next: "bone_density", points: { sarcopenia: 8 } },
                { text: "I'm still quite strong.", next: "bone_density", points: { sarcopenia: 0 } }
            ]
        },
        "bone_density": {
            category: "Skeletal Density",
            text: "Have you ever been diagnosed with Osteopenia or Osteoporosis?",
            options: [
                { text: "Yes, I'm currently managing it.", next: "cardio_intro", points: { bone: 20, fracture_risk: 15 } },
                { text: "No, but it runs in my family.", next: "cardio_intro", points: { bone: 10 } },
                { text: "No issues.", next: "cardio_intro", points: { bone: 0 } }
            ]
        },
        "cardio_intro": {
            category: "Vascular Reserve",
            text: "Does walking up a single flight of stairs leave you breathless for more than 30 seconds?",
            options: [
                { text: "Yes, I have to catch my breath.", next: "cardio_bp", points: { cardio: 15, vo2_max: 10 } },
                { text: "I feel it, but recover fast.", next: "cardio_bp", points: { cardio: 5 } },
                { text: "No, I can handle it easily.", next: "cardio_bp", points: { cardio: 0 } }
            ]
        },
        "cardio_bp": {
            category: "Arterial Health",
            text: "What is your typical Systolic Blood Pressure (top number)?",
            options: [
                { text: "Over 140", next: "final_vision", points: { bp: 20, stroke_risk: 10 } },
                { text: "125 - 139", next: "final_vision", points: { bp: 10 } },
                { text: "Under 120", next: "final_vision", points: { bp: 0 } }
            ]
        },
        "mitochondria_1": {
            category: "Bio-Genetics",
            text: "How quickly do you feel you recover from physical exertion?",
            options: [
                { text: "It takes me a full day or more.", next: "final_vision", points: { mitochondria: 15 } },
                { text: "I'm back to normal in an hour.", next: "final_vision", points: { mitochondria: 0 } }
            ]
        },
        "final_vision": {
            category: "The Outcome",
            text: "If you could reverse one physical limitation today, which would impact your joy the most?",
            options: [
                { text: "Living without pain.", next: "end", points: { longevity: 10 } },
                { text: "Walking with confidence.", next: "end", points: { stability: 10, longevity: 10 } },
                { text: "Sharp mental clarity.", next: "end", points: { cognitive: 10, longevity: 10 } },
                { text: "Unlimited daily energy.", next: "end", points: { metabolic: 10, longevity: 10 } }
            ]
        }
    };

    const INSIGHT_DATABASE = [
        { id: "stability", threshold: 10, title: "Fall Risk Neutralization", val: 34, desc: "Specific neuromuscular balance training reduces clinical fall risk by 34%, preventing the primary cause of senior hospitalization.", citation: "Sherrington et al., Cochrane Library" },
        { id: "metabolic", threshold: 10, title: "Insulin Sensitivity Shift", val: 48, desc: "Resistance training can improve glucose clearance by 48%, effectively managing A1c levels better than some pharmaceutical interventions.", citation: "Boule et al., JAMA" },
        { id: "joints", threshold: 10, title: "Cartilage Preservation", val: 47, desc: "Targeted loading protocols (not rest) reduce osteoarthritis pain by 47% by stimulating synovial fluid flow.", citation: "Fransen et al., British Journal of Sports Medicine" },
        { id: "cognitive", threshold: 10, title: "Neuro-Plasticity Gain", val: 20, desc: "Consistent aerobic and strength work is proven to increase hippocampal volume by 2%—effectively 'younging' the memory center by 2 years.", citation: "Erickson et al., PNAS" },
        { id: "bone", threshold: 10, title: "Bone Mineral Shield", val: 22, desc: "High-intensity impact loading increases bone density by 22% in at-risk seniors, drastically reducing fracture risk.", citation: "Watson et al., JBMR" },
        { id: "mortality_risk", threshold: 10, title: "All-Cause Mortality Reduction", val: 50, desc: "Maintaining high muscle mass in later years is associated with a 50% lower risk of all-cause mortality.", citation: "Srikanthan et al., Am J Med" },
        { id: "dementia_risk", threshold: 10, title: "Alzheimer's Defense", val: 40, desc: "Regular physical activity is associated with a 40% reduction in the risk of developing Alzheimer's and other dementias.", citation: "Livingston et al., The Lancet" },
        { id: "visceral_fat", threshold: 10, title: "Inflammation Suppression", val: 31, desc: "Exercise directly targets visceral 'belly' fat, reducing chronic systemic inflammation markers (CRP) by 31%.", citation: "Fedewa et al., British Journal of Sports Medicine" },
        { id: "cardio", threshold: 10, title: "Vascular Compliance", val: 27, desc: "Arterial stiffness can be reversed with consistent load, reducing stroke and heart attack risk by 27%.", citation: "Lee et al., Stroke" },
        { id: "sarcopenia", threshold: 10, title: "Grip Vitality Anchor", val: 55, desc: "Strength training prevents sarcopenia, keeping you 55% more likely to remain independent in your own home after age 75.", citation: "Tak et al., Ageing Res Rev" },
        { id: "mitochondria", threshold: 10, title: "Mitochondrial Biogenesis", val: 65, desc: "Exercise signals the body to create new mitochondria, increasing cellular energy output by up to 65%.", citation: "Puetz et al., Psychological Bulletin" },
        { id: "longevity", threshold: 10, title: "The Longevity Dividend", val: 88, desc: "Active individuals enjoy a 7-year advantage in 'Health Span'—years lived without chronic disability.", citation: "Moore et al., PLOS Medicine" }
    ];

    let score = {};
    let stepCount = 0;
    const estimatedSteps = 12;

    function renderQuestion(id) {
        const q = QUIZ_DATA[id];
        const container = document.getElementById('quiz-container');
        container.classList.remove('fade-in');
        void container.offsetWidth;
        container.classList.add('fade-in');

        document.getElementById('q-category').innerText = q.category;
        document.getElementById('q-text').innerText = q.text;
        const optionsEl = document.getElementById('q-options');
        optionsEl.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => {
                if (opt.points) {
                    for (let k in opt.points) score[k] = (score[k] || 0) + opt.points[k];
                }
                stepCount++;
                document.getElementById('progress-bar').style.width = Math.min((stepCount / estimatedSteps * 100), 100) + "%";
                if (opt.next === "end") showResults();
                else renderQuestion(opt.next);
            };
            optionsEl.appendChild(btn);
        });
    }

    function showResults() {
        document.getElementById('quiz-container').style.display = 'none';
        const res = document.getElementById('results-container');
        res.style.display = 'flex';
        res.classList.add('fade-in');

        const grid = document.getElementById('insights-grid');
        grid.innerHTML = "";

        // Algorithm: Show top 8 relevant insights
        const sortedInsights = INSIGHT_DATABASE
            .map(ins => ({ ...ins, weight: score[ins.id] || 0 }))
            .sort((a, b) => b.weight - a.weight)
            .slice(0, 8);

        sortedInsights.forEach((insight, idx) => {
            const card = document.createElement('div');
            card.className = "metric-card fade-in";
            card.style.animationDelay = (idx * 0.1) + "s";
            card.innerHTML = `
                <div class="chart-box">
                    <svg class="chart-svg" viewBox="0 0 160 160">
                        <circle class="chart-bg" cx="80" cy="80" r="70"></circle>
                        <circle class="chart-fill" id="fill-${insight.id}-${idx}" cx="80" cy="80" r="70"></circle>
                    </svg>
                    <div class="chart-val">${insight.val}%</div>
                </div>
                <div class="metric-title">${insight.title}</div>
                <div class="metric-desc">${insight.desc}</div>
                <div class="citation">Source: ${insight.citation}</div>
            `;
            grid.appendChild(card);

            setTimeout(() => {
                const ring = document.getElementById(`fill-${insight.id}-${idx}`);
                if(ring) ring.style.strokeDashoffset = 440 - (insight.val / 100) * 440;
            }, 400);
        });
    }
  </script>
</body>
</html>
