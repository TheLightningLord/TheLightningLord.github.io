<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympian Health Solutions | Elite Entrance</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --silver-light: #f8fafc;
            --silver-med: #94a3b8;
            --silver-dark: #475569;
            --blue-electric: #3b82f6;
            --blue-deep: #172554;
            --void: #020617;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            cursor: none; /* Custom cursor */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--void);
            font-family: 'Outfit', sans-serif;
            color: var(--silver-light);
        }

        /* === CURSOR SYSTEM === */
        .cursor-dot {
            position: fixed; top: 0; left: 0;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none; z-index: 10000;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }
        .cursor-ring {
            position: fixed; top: 0; left: 0;
            width: 40px; height: 40px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, border-color 0.3s;
        }
        body.hovering .cursor-ring {
            width: 80px; height: 80px;
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--blue-electric);
        }

        /* === BACKGROUND CANVAS === */
        #neural-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* === MAIN STAGE === */
        .stage-container {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            perspective: 2000px;
            opacity: 0; 
            animation: curtainUp 2s ease-out forwards 0.5s;
        }

        @keyframes curtainUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* === ATOMIC CORE (LOGO + RINGS) === */
        .atomic-core {
            position: relative;
            width: 350px; height: 350px;
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d;
            margin-bottom: 2rem;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .mega-logo {
            width: 160px; height: auto;
            transform: translateZ(60px);
            filter: drop-shadow(0 0 35px rgba(59,130,246,0.5));
            animation: floatLogo 6s ease-in-out infinite;
            z-index: 10;
        }

        /* Orbital Rings */
        .ring {
            position: absolute;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.05);
            pointer-events: none;
        }
        
        .ring-1 { width: 280px; height: 280px; animation: spin 12s linear infinite; border-top: 2px solid var(--blue-electric); }
        .ring-2 { width: 340px; height: 340px; animation: spin 18s linear infinite reverse; border-bottom: 2px solid #fff; }
        .ring-3 { width: 400px; height: 400px; animation: spin3D 25s linear infinite; border-left: 2px solid var(--silver-med); }

        .ring::after {
            content: ''; position: absolute; top: -3px; left: 50%;
            width: 6px; height: 6px; background: var(--blue-electric);
            border-radius: 50%; box-shadow: 0 0 10px var(--blue-electric);
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateZ(60px) translateY(0); }
            50% { transform: translateZ(60px) translateY(-15px); }
        }
        @keyframes spin { 0% { transform: rotateZ(0deg); } 100% { transform: rotateZ(360deg); } }
        @keyframes spin3D { 
            0% { transform: rotateX(65deg) rotateY(0deg); } 
            100% { transform: rotateX(65deg) rotateY(360deg); } 
        }

        /* === TYPOGRAPHY === */
        .hero-text {
            text-align: center;
            transform: translateZ(40px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .text-primary {
            display: block;
            font-size: clamp(2.5rem, 6vw, 5rem);
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .text-secondary {
            display: block;
            font-size: clamp(1rem, 3vw, 2.2rem);
            font-weight: 400;
            color: var(--blue-electric);
            letter-spacing: 0.2em;
            background: linear-gradient(90deg, #94a3b8 0%, #3b82f6 50%, #94a3b8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        p.tagline {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            color: var(--silver-dark);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-top: 25px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.8s;
        }

        /* === MAG-LEV BUTTON === */
        .btn-wrapper {
            margin-top: 60px;
            position: relative;
            width: 280px;
            height: 70px;
            display: flex; justify-content: center; align-items: center;
            opacity: 0;
            animation: fadeIn 1s ease forwards 2.2s;
        }

        .mag-btn {
            position: relative;
            display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .mag-btn::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--blue-electric);
            transform: scaleX(0); transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: -1;
        }

        .mag-btn:hover { border-color: var(--blue-electric); box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); }
        .mag-btn:hover::before { transform: scaleX(1); }
        
        .corner {
            position: absolute; width: 10px; height: 10px;
            border: 2px solid var(--silver-med);
            transition: 0.3s; pointer-events: none;
        }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .btn-wrapper:hover .corner { border-color: #fff; width: 15px; height: 15px; }

        @keyframes fadeIn { to { opacity: 1; } }

        @media (max-width: 768px) {
            .atomic-core { transform: scale(0.65); margin-bottom: 1rem; }
            h1 { font-size: 2rem; }
            .btn-wrapper { margin-top: 40px; transform: scale(0.9); }
        }

    </style>
</head>
<body>

    <!-- CUSTOM CURSOR -->
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- BACKGROUND -->
    <canvas id="neural-canvas"></canvas>

    <!-- MAIN CONTENT -->
    <div class="stage-container">
        
        <!-- 3D LOGO SYSTEM -->
        <div class="atomic-core" id="tilt-target">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            
            <img src="https://raw.githubusercontent.com/TheLightningLord/TheLightningLord.github.io/gh-pages/assets/images/ologo.png" alt="Olympian Logo" class="mega-logo">
        </div>

        <div class="hero-text">
            <h1>
                <span class="text-primary scramble-target-1">Olympian</span>
                <span class="text-secondary scramble-target-2">Health Solutions</span>
            </h1>
            <p class="tagline">The Architecture of Longevity</p>
            
            <div class="btn-wrapper" id="mag-btn-wrap">
                <div class="corner tl"></div><div class="corner tr"></div>
                <div class="corner bl"></div><div class="corner br"></div>
                <a href="index.html" class="mag-btn">Enter System</a>
            </div>
        </div>

    </div>

    <script>
        // === 1. NEURAL NETWORK CANVAS (UPDATED) ===
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let points = [];
        const mouse = { x: -1000, y: -1000 }; // Start off-screen

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initPoints();
        }

        function initPoints() {
            points = [];
            // More points for a richer network
            const count = window.innerWidth < 768 ? 40 : 80;
            for(let i = 0; i < count; i++) {
                points.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    size: Math.random() * 2 + 1,
                    pulse: Math.random() * Math.PI
                });
            }
        }

        function animateCanvas() {
            ctx.fillStyle = '#020617'; // Void color
            ctx.fillRect(0, 0, width, height);
            
            points.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;

                // Bounce off walls
                if(p.x < 0 || p.x > width) p.vx *= -1;
                if(p.y < 0 || p.y > height) p.vy *= -1;
                
                // Pulsing size
                p.pulse += 0.05;
                const pulsingSize = p.size + Math.sin(p.pulse) * 0.5;

                // Draw Point
                ctx.beginPath();
                ctx.arc(p.x, p.y, pulsingSize, 0, Math.PI * 2);
                ctx.fillStyle = '#94a3b8'; // Silver
                ctx.fill();

                // 1. Connect to Mouse (Interaction)
                const distMouse = Math.hypot(mouse.x - p.x, mouse.y - p.y);
                if (distMouse < 200) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(59, 130, 246, ${1 - distMouse/200})`; // Blue
                    ctx.lineWidth = 0.8;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                    
                    // Gentle magnetic pull
                    p.x += (mouse.x - p.x) * 0.005;
                    p.y += (mouse.y - p.y) * 0.005;
                }

                // 2. Connect to Neighbors
                for(let j = i + 1; j < points.length; j++) {
                    const p2 = points[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);

                    if(dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(148, 163, 184, ${0.4 * (1 - dist/150)})`; // Silver lines
                        ctx.lineWidth = 0.4;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(animateCanvas);
        }

        // === 2. 3D TILT ENGINE ===
        const stage = document.querySelector('.stage-container');
        const atomicCore = document.querySelector('.atomic-core');
        const heroText = document.querySelector('.hero-text');

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;

            // Apply tilt to core
            atomicCore.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            // Parallax text
            heroText.style.transform = `translateZ(40px) translateX(${-xAxis}px) translateY(${-yAxis}px)`;
        });

        // === 3. BUTTON PHYSICS ===
        const btnWrap = document.getElementById('mag-btn-wrap');
        const btn = btnWrap.querySelector('.mag-btn');

        btnWrap.addEventListener('mousemove', (e) => {
            const rect = btnWrap.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            btn.style.transform = `translate(${x * 0.4}px, ${y * 0.4}px)`;
            document.body.classList.add('hovering');
        });

        btnWrap.addEventListener('mouseleave', () => {
            btn.style.transform = `translate(0, 0)`;
            document.body.classList.remove('hovering');
        });

        // === 4. SCRAMBLE TEXT ===
        class TextScramble {
            constructor(el) {
                this.el = el;
                this.chars = '!<>-_\\/[]{}—=+*^?#________';
                this.update = this.update.bind(this);
            }
            setText(newText) {
                const oldText = this.el.innerText;
                const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => this.resolve = resolve);
                this.queue = [];
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 40);
                    const end = start + Math.floor(Math.random() * 40);
                    this.queue.push({ from, to, start, end });
                }
                cancelAnimationFrame(this.frameRequest);
                this.frame = 0;
                this.update();
                return promise;
            }
            update() {
                let output = '';
                let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    if (this.frame >= end) {
                        complete++;
                        output += to;
                    } else if (this.frame >= start) {
                        if (!char || Math.random() < 0.28) {
                            char = this.randomChar();
                            this.queue[i].char = char;
                        }
                        output += `<span class="dud" style="opacity:0.5">${char}</span>`;
                    } else {
                        output += from;
                    }
                }
                this.el.innerHTML = output;
                if (complete === this.queue.length) {
                    this.resolve();
                } else {
                    this.frameRequest = requestAnimationFrame(this.update);
                    this.frame++;
                }
            }
            randomChar() {
                return this.chars[Math.floor(Math.random() * this.chars.length)];
            }
        }

        // === 5. CURSOR ===
        const dot = document.querySelector('.cursor-dot');
        const ring = document.querySelector('.cursor-ring');

        document.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            
            ring.animate({
                left: e.clientX + 'px',
                top: e.clientY + 'px'
            }, { duration: 400, fill: "forwards" });
        });

        // === INIT ===
        window.addEventListener('resize', resize);
        resize();
        animateCanvas();

        const t1 = document.querySelector('.scramble-target-1');
        const t2 = document.querySelector('.scramble-target-2');
        
        const fx1 = new TextScramble(t1);
        const fx2 = new TextScramble(t2);

        setTimeout(() => { fx1.setText('Olympian'); }, 800);
        setTimeout(() => { fx2.setText('Health Solutions'); }, 1400);

    </script>
</body>
</html>
