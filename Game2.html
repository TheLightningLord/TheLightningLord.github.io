<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vitality Nebula | OHS Elite Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --theme-primary: #3b82f6;
      --theme-accent: #60a5fa;
      --theme-gold: #facc15;
      --theme-glow: rgba(59, 130, 246, 0.5);
      --color-navy: #020617;
      --font-header: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: var(--color-navy);
      font-family: var(--font-body);
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }

    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }

    #ui-layer {
      position: fixed; inset: 0;
      z-index: 100; pointer-events: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 50px;
      width: 90%;
      max-width: 500px;
      pointer-events: auto;
      text-align: center;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    }

    .btn-vitality {
      background: linear-gradient(135deg, var(--theme-primary), var(--theme-accent));
      padding: 22px 45px; border-radius: 99px;
      font-weight: 900; font-family: var(--font-header);
      text-transform: uppercase; letter-spacing: 0.15em;
      box-shadow: 0 15px 40px var(--theme-glow);
      transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: none;
      color: #fff;
    }
    .btn-vitality:hover { transform: scale(1.05); filter: brightness(1.1); }

    /* Game HUD */
    #hud {
        position: fixed; top: 40px; left: 0; width: 100%;
        display: flex; justify-content: space-between; padding: 0 40px;
        z-index: 200; pointer-events: none; opacity: 0; transition: 0.8s;
    }
    #hud.active { opacity: 1; }

    .stat-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.4; margin-bottom: 4px; }
    .stat-value { font-family: var(--font-header); font-size: 2.5rem; font-weight: 900; line-height: 1; }

    .vitality-bar-wrap {
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
        width: 300px; height: 6px; background: rgba(255,255,255,0.05);
        border-radius: 10px; overflow: hidden; z-index: 200;
    }
    #vitality-fill {
        width: 100%; height: 100%;
        background: linear-gradient(to right, #ef4444, var(--theme-primary), var(--theme-accent));
        transition: width 0.3s ease;
    }

    .ai-insight {
        margin-top: 30px; padding: 25px;
        background: rgba(var(--theme-primary), 0.05);
        border-radius: 24px; text-align: left;
        display: none; font-size: 0.85rem; line-height: 1.6;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .ai-insight.active { display: block; animation: fadeInUp 0.8s ease-out; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Hold Instruction Overlay */
    #hold-prompt {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-weight: 900; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5em;
        opacity: 0; transition: 0.5s; pointer-events: none; z-index: 150;
    }
    #hold-prompt.visible { opacity: 0.3; }

  </style>
</head>
<body>

  <canvas id="nebula-canvas"></canvas>

  <div id="hud">
      <div>
          <div class="stat-label">Synthesis Level</div>
          <div class="stat-value tabular-nums" id="score-val">0</div>
      </div>
      <div class="text-right">
          <div class="stat-label">Stability</div>
          <div class="stat-value tabular-nums text-blue-400" id="stability-val">100%</div>
      </div>
  </div>

  <div class="vitality-bar-wrap" id="bar-container" style="display:none;">
      <div id="vitality-fill"></div>
  </div>

  <div id="hold-prompt">Place and Hold</div>

  <div id="ui-layer">
      <!-- START SCREEN -->
      <div id="start-screen" class="glass-card">
          <div class="w-24 h-24 bg-blue-500/10 rounded-full mx-auto flex items-center justify-center mb-8 border border-blue-400/20 relative">
              <div class="absolute inset-0 bg-blue-400/20 rounded-full animate-ping"></div>
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          </div>
          <h1 class="text-4xl font-black mb-4">Vitality Nebula</h1>
          <p class="text-sm opacity-50 leading-relaxed mb-10">Touch the screen to generate your energy well. Keep holding to harvest biological sparks and expand your neural reach.</p>
          
          <button class="btn-vitality w-full" onclick="game.start()">Begin Synthesis</button>
          
          <button class="mt-8 text-[10px] font-black uppercase tracking-widest opacity-30 hover:opacity-100 transition-opacity" onclick="askCoach('focus')">Request Neural Focus ✨</button>
          <div id="ai-focus-box" class="ai-insight italic"></div>
      </div>

      <!-- RESULTS SCREEN -->
      <div id="game-over" class="hidden glass-card">
          <h2 class="text-2xl font-black mb-2 opacity-50">Synthesis Complete</h2>
          <div class="text-7xl font-black text-blue-400 mb-2" id="final-score">0</div>
          <div class="text-[10px] font-black uppercase tracking-[0.3em] mb-10">Total Vitality Harvested</div>
          
          <div id="ai-analysis-box" class="ai-insight active">
              <div class="flex justify-center gap-2 py-4">
                  <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce"></div>
                  <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                  <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce [animation-delay:0.4s]"></div>
              </div>
          </div>

          <div class="flex flex-col gap-4 mt-10">
              <button class="btn-vitality w-full" onclick="location.reload()">Re-Sync System</button>
              <a href="booking.html" class="text-[10px] font-black uppercase tracking-widest py-2 opacity-40 hover:opacity-100 transition-opacity">Book Longevity Coaching</a>
          </div>
      </div>
  </div>

  <script>
    const apiKey = ""; // Set by environment

    // --- GEMINI INTELLIGENCE ---
    async function fetchGemini(prompt, systemInstruction) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] }
                })
            });
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (err) { return "Focus on the steady light."; }
    }

    async function askCoach(type) {
        if(type === 'focus') {
            const box = document.getElementById('ai-focus-box');
            box.style.display = 'block';
            box.classList.add('active');
            const insight = await fetchGemini("Provide 1 elite senior mobility focus for today. 12 words max.", "You are an OHS Expert Coach.");
            box.innerHTML = `<strong>Focus:</strong> "${insight}"`;
        } else {
            const box = document.getElementById('ai-analysis-box');
            const insight = await fetchGemini(`Analyze harvest score of ${game.score}. Explain how sustained hold focus prevents stumbles and improves daily grip. 2 sentences.`, "You are a Senior Longevity Specialist.");
            box.innerHTML = `<strong>Synthesis Report:</strong> ${insight}`;
        }
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('nebula-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class Particle {
        constructor(x, y, color, type = 'swarm') {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.r = Math.random() * 2 + 1;
            this.life = 1; this.color = color; this.type = type;
        }
        update(tx, ty, active) {
            if (active && this.type === 'swarm') {
                const dx = tx - this.x; const dy = ty - this.y;
                const dist = Math.sqrt(dx*dx+dy*dy);
                this.vx += dx * 0.003; this.vy += dy * 0.003;
                this.vx *= 0.95; this.vy *= 0.95;
            } else if (this.type === ' Mitochondria') {
                this.x += this.vx; this.y += this.vy;
            }
            this.x += this.vx; this.y += this.vy;
            this.life -= this.type === 'spark' ? 0.02 : 0.005;
        }
        draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${this.color}, ${this.life * 0.6})`; ctx.fill();
        }
    }

    class Entity {
        constructor(type) {
            this.type = type;
            this.r = type === 'mito' ? 8 : 25;
            this.x = Math.random() * width;
            this.y = type === 'mito' ? -50 : height + 50;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = type === 'mito' ? (1 + Math.random() * 2) : (-1 - Math.random() * 1);
            this.pulse = 0;
        }
        update() { this.x += this.vx; this.y += this.vy; this.pulse += 0.1; }
        draw() {
            ctx.beginPath();
            const glow = this.type === 'mito' ? '59, 130, 246' : '239, 68, 68';
            const size = this.r + Math.sin(this.pulse) * 3;
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, size * 2);
            grad.addColorStop(0, `rgba(${glow}, 0.3)`); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.arc(this.x, this.y, size * 2, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = `rgba(${glow}, 0.8)`; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(this.x, this.y, size, 0, Math.PI*2); ctx.stroke();
        }
    }

    class Game {
        constructor() {
            this.isActive = false; this.isHolding = false;
            this.score = 0; this.energy = 100;
            this.particles = []; this.entities = [];
            this.touch = { x: -1000, y: -1000 };
            this.themeColor = "59, 130, 246";
        }

        start() {
            this.isActive = true;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('active');
            document.getElementById('bar-container').style.display = 'block';
            document.getElementById('hold-prompt').classList.add('visible');
            this.themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-bubble').trim() || "59, 130, 246";
            this.loop();
            this.spawn();
        }

        spawn() {
            if(!this.isActive) return;
            const type = Math.random() > 0.3 ? 'mito' : 'entropy';
            this.entities.push(new Entity(type));
            setTimeout(() => this.spawn(), 800 - Math.min(500, this.score / 5));
        }

        loop() {
            if(!this.isActive) return;
            ctx.fillStyle = 'rgba(2, 6, 23, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Background Nebula Flow
            ctx.globalCompositeOperation = 'screen';
            ctx.strokeStyle = `rgba(${this.themeColor}, 0.03)`;
            ctx.lineWidth = 200;
            ctx.beginPath();
            ctx.moveTo(0, height/2);
            ctx.bezierCurveTo(width/3, height/2 + Math.sin(Date.now()*0.001)*100, width*0.6, height/2 - Math.cos(Date.now()*0.001)*100, width, height/2);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';

            if (this.isHolding) {
                this.energy = Math.min(100, this.energy + 0.05);
                // Particle Swarm
                for(let i=0; i<3; i++) this.particles.push(new Particle(Math.random()*width, Math.random()*height, this.themeColor));
                
                // Draw Hold Core
                const grad = ctx.createRadialGradient(this.touch.x, this.touch.y, 0, this.touch.x, this.touch.y, 100);
                grad.addColorStop(0, `rgba(${this.themeColor}, 0.3)`); grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.touch.x, this.touch.y, 100, 0, Math.PI*2); ctx.fill();
            } else {
                this.energy -= 0.15;
            }

            // Entities
            this.entities.forEach((e, i) => {
                e.update(); e.draw();
                const dist = Math.sqrt((this.touch.x-e.x)**2 + (this.touch.y-e.y)**2);
                
                if (this.isHolding && dist < e.r + 50) {
                    if (e.type === 'mito') {
                        this.score += 10;
                        this.energy = Math.min(100, this.energy + 5);
                        for(let j=0; j<10; j++) this.particles.push(new Particle(e.x, e.y, this.themeColor, 'spark'));
                        this.entities.splice(i, 1);
                    } else {
                        this.energy -= 20;
                        for(let j=0; j<15; j++) this.particles.push(new Particle(e.x, e.y, "239, 68, 68", 'spark'));
                        this.entities.splice(i, 1);
                        document.body.style.backgroundColor = '#1e0000';
                        setTimeout(() => document.body.style.backgroundColor = 'var(--color-navy)', 100);
                    }
                }
                if (e.y < -100 || e.y > height + 100) this.entities.splice(i, 1);
            });

            // Update UI
            document.getElementById('score-val').textContent = this.score;
            document.getElementById('stability-val').textContent = Math.round(this.energy) + '%';
            document.getElementById('vitality-fill').style.width = this.energy + '%';

            // Particles
            this.particles.forEach((p, i) => {
                p.update(this.touch.x, this.touch.y, this.isHolding);
                p.draw();
                if (p.life <= 0) this.particles.splice(i, 1);
            });

            if(this.energy <= 0) this.end();
            requestAnimationFrame(() => this.loop());
        }

        end() {
            this.isActive = false;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').textContent = this.score;
            document.getElementById('hud').classList.remove('active');
            document.getElementById('bar-container').style.display = 'none';
            askCoach();
        }
    }

    const game = new Game();
    window.onload = () => {
        resize();
        const start = (e) => { 
            e.preventDefault();
            const t = e.touches ? e.touches[0] : e; 
            game.isHolding = true; game.touch = {x: t.clientX, y: t.clientY}; 
            document.getElementById('hold-prompt').classList.remove('visible');
        };
        const move = (e) => { 
            if(!game.isHolding) return;
            const t = e.touches ? e.touches[0] : e; 
            game.touch = {x: t.clientX, y: t.clientY}; 
        };
        const stop = () => { game.isHolding = false; document.getElementById('hold-prompt').classList.add('visible'); };
        
        window.addEventListener('mousedown', start); window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        window.addEventListener('touchstart', start, {passive:false}); window.addEventListener('touchmove', move, {passive:false}); window.addEventListener('touchend', stop);
    };
    window.onresize = resize;
  </script>
</body>
</html>
